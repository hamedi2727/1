<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Concrete Pumping Control System</title>
  <style>
    body {
      margin: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    #svgWrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #svgContainer {
      transform-origin: center center;
      transition: transform 0.1s linear;
    }

    /* حركة تدفق تدريجي من الأسفل للأعلى */
    .flow-line {
      stroke: #ffffff;
      stroke-width: 3;
      cursor: pointer;

      /* طول تقريبي للخطوط */
      stroke-dasharray: 300;
      stroke-dashoffset: 300;

      /* سرعة الحركة (غيّر الرقم حسب رغبتك) */
      animation: progressiveFlow 2.5s linear infinite;

      transition: 0.25s ease;
    }

    /* الحركة التدريجية */
    @keyframes progressiveFlow {
      0% {
        stroke-dashoffset: 300; /* يبدأ من الأسفل */
      }
      100% {
        stroke-dashoffset: 0;   /* يصعد للأعلى */
      }
    }

    /* عند المرور */
    .flow-line:hover {
      stroke-width: 4;
      filter: drop-shadow(0 0 4px #ffffff);
    }

    /* عند النقر – توقف الحركة + إضاءة */
    .line-active {
      stroke-width: 6 !important;
      filter: drop-shadow(0 0 10px #ffffff);
      animation: none !important;
      stroke-dashoffset: 0 !important;
    }
  </style>
</head>
<body>

<div id="svgWrapper">
  <div id="svgContainer">
    <svg id="mainSvg" width="100%" height="100%" viewBox="0 0 1400 650">

      <!-- عنوان -->

        <line x1="100" y1="210" x2="1300" y2="210" stroke="#333" stroke-width="0.5"/>
        <line x1="100" y1="300" x2="1300" y2="300" stroke="#333" stroke-width="0.5"/>
        <line x1="100" y1="420" x2="1300" y2="420" stroke="#333" stroke-width="0.5"/>

        <rect x="1210" y="190" width="80" height="50" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.8" rx="6" ry="6"/><text x="1250" y="215">L.68</text>

        <rect x="610" y="280" width="80" height="50" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.8" rx="6" ry="6"/><text x="650" y="305">Line #3</text>
        <rect x="810" y="280" width="80" height="50" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.8" rx="6" ry="6"/><text x="850" y="305">Line #4</text>
        <rect x="1010" y="280" width="80" height="50" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.8" rx="6" ry="6"/><text x="1050" y="305">Line #5</text>
        <rect x="1210" y="280" width="80" height="50" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.8" rx="6" ry="6"/><text x="1250" y="305">Line #6</text>
      </g>

      <!-- الصف السفلي (المضخات – خوخي) -->
      <g fill="#000" font-size="12" text-anchor="middle">
        <g id="SP1" onclick="showDetails('SP1','Concrete Pump')" style="cursor:pointer">
          <rect x="380" y="420" width="160" height="70" fill="#FFCC80" stroke="#FB8C00" stroke-width="1.8" rx="6" ry="6"/>
          <text x="460" y="445" font-weight="bold">SP.Pump (1)</text>
          <text x="460" y="465">8800126</text>

        <g id="SP2" onclick="showDetails('SP2','Concrete Pump')" style="cursor:pointer">
          <rect x="580" y="420" width="160" height="70" fill="#FFCC80" stroke="#FB8C00" stroke-width="1.8" rx="6" ry="6"/>
          <text x="660" y="445" font-weight="bold">SP.Pump (2)</text>
          <text x="660" y="465">8800121</text>
        </g>
        <g id="SP3" onclick="showDetails('SP3','Concrete Pump')" style="cursor:pointer">
          <rect x="780" y="420" width="160" height="70" fill="#FFCC80" stroke="#FB8C00" stroke-width="1.8" rx="6" ry="6"/>
          <text x="860" y="445" font-weight="bold">SP.Pump (3)</text>
          <text x="860" y="465">8800124</text>
        </g>
        <g id="SP4" onclick="showDetails('SP4','Concrete Pump')" style="cursor:pointer">
          <rect x="980" y="420" width="160" height="70" fill="#FFCC80" stroke="#FB8C00" stroke-width="1.8" rx="6" ry="6"/>
          <text x="1060" y="445" font-weight="bold">SP.Pump (4)</text>
          <text x="1060" y="465">8800127</text>
        </g>
    

      <!-- خطوط الربط الأصلية (خلفية) -->
      <g stroke="#E0E0E0" stroke-width="2">
        <path d="M 250 330 L 250 380 L 450 380 L 450 420" fill="none" />
        <path d="M 450 330 L 450 380" fill="none" />

              x1="450" y1="190" x2="450" y2="160"

              onclick="highlightLine('FL_R6_LOC6')" />

</div>

<script>
  // دالة بسيطة حتى لا يحدث خطأ عند الضغط على العناصر
  function showDetails(id, type) {
    console.log('Show details:', id, type);
  }

  // تمييز خط التدفق عند النقر
  function highlightLine(id) {
    document.querySelectorAll(".flow-line")
      .forEach(l => l.classList.remove("line-active"));
    const el = document.getElementById(id);
    if (el) el.classList.add("line-active");
  }

  // زوم + سحب بسيط (اختياري)
  let currentScale = 1;
  let currentTranslate = { x: 0, y: 0 };
  let isPanning = false;
  let startPan = { x: 0, y: 0 };

  const svgContainer = document.getElementById("svgContainer");
  const svgWrapper = document.getElementById("svgWrapper");

  function updateTransform() {
    svgContainer.style.transform =
      `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentScale})`;
  }

  svgWrapper.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    currentScale = Math.min(2.5, Math.max(0.7, currentScale + delta));
    updateTransform();
  });

  svgWrapper.addEventListener("mousedown", (e) => {
    isPanning = true;
    startPan = { x: e.clientX - currentTranslate.x, y: e.clientY - currentTranslate.y };
  });

  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    currentTranslate.x = e.clientX - startPan.x;
    currentTranslate.y = e.clientY - startPan.y;
    updateTransform();
  });

  window.addEventListener("mouseup", () => {
    isPanning = false;
  });
</script>

</body>
</html>
