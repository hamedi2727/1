<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>CPC - REC | Operations Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* HEADER */
.fixed-header {
  direction: ltr !important;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  direction: ltr !important;
}
.header-logo {
  height: 60px;
  object-fit: contain;
}
.title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
  direction: rtl;
}
.lang-switch {
  display:flex;
  gap:8px;
  direction:ltr !important;
}
.lang-switch button {
  padding:6px 12px;
  border-radius:6px;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer;
  font-size:13px;
}
.lang-switch button.active {
  background:#0ea5e9;
  border-color:#38bdf8;
}

/* GRID — الإصلاح هنا */
.dashboard {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-auto-rows: auto;
  align-items: start;
  gap: 20px;
  padding: 25px;
}

/* BOX */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}

/* صندوق التفاصيل يتقلص */
#detailsBox {
  height: auto !important;
  max-height: fit-content !important;
}

/* عناوين الصناديق */
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

/* SVG WRAPPER */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container { transform-origin: center center; cursor: grab; }
.svg-container:active { cursor: grabbing; }

/* LEGEND */
.legend-item {
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border-radius:6px;
  background:#020617;
  border:1px solid #1f2937;
}

/* PDF TABLE */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-icon { color: #f97316; font-size: 18px; }

/* ICON BUTTONS */
.doc-icons {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
}
.doc-btn {
  flex:1;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  padding:8px 6px;
  text-align:center;
  cursor:pointer;
  transition:0.25s;
}
.doc-btn:hover {
  background:#0f172a;
  transform:translateY(-3px);
}
.doc-btn div {
  font-size:12px;
  margin-bottom:4px;
}
.doc-btn span {
  font-size:12px;
  opacity:0.85;
}

/* ANIMATION */
@keyframes fadeSlide {
  to { opacity: 1; transform: translateY(0); }
}

/* DATETIME BAR */
.datetime-bar {
  background: #0f172a;
  border-bottom: 1px solid #1f2937;
  padding: 8px 25px;
  font-size: 15px;
  direction:ltr;
}
</style>
</head>
<body>

<header class="fixed-header">
  <div class="header-left">
    <img src="qq.png" class="header-logo" alt="Logo">
    <div class="title">CPC - REC | Operations Dashboard</div>
  </div>

  <div class="lang-switch">
    <button id="langAr" class="active">العربية</button>
    <button id="langEn">English</button>
  </div>
</header>

<div class="datetime-bar">

<!-- لاحظ: لا يوجد grid-row نهائيًا — وهذا هو سبب نجاح الترتيب -->

<!-- DETAILS BOX -->
<div class="box" id="detailsBox" style="grid-column:2;">
  <h2 id="detailsTitle">تفاصيل العنصر</h2>
  <div id="detailName" style="font-size:18px; font-weight:bold; margin-bottom:10px;">—</div>
  <div id="detailInfo" style="font-size:14px; line-height:1.8; margin:0;">
    اختر عنصرًا من المخطط لعرض التفاصيل.
  </div>
</div>

<!-- CATALOG BOX -->
<div class="box" id="catalogBox" style="grid-column:2;">
  <h2 id="catalogTitle">الكتالوج</h2>
  <div id="catalogContent">
    لا توجد بيانات للعرض.
  </div>
</div>

<!-- ARCHIVE BOX -->
<div class="box" id="archiveBox" style="grid-column:2;">
  <h2 id="archiveTitle">الأرشيف</h2>
  <div id="archiveContent">
    لا توجد ملفات.
  </div>
</div>

<!-- MAINTENANCE BOX -->
<div class="box" id="maintenanceBox" style="grid-column:2;">
  <h2 id="maintenanceTitle">الصيانة</h2>
  <div id="maintenanceContent">
    لا توجد بيانات صيانة.
  </div>
</div>
<script>
// =======================
// تحديث الوقت والتاريخ
// =======================
function updateDateTime() {
  const now = new Date();
  const options = {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  };
  document.getElementById("dateTime").textContent = now.toLocaleString('ar-SA', options);
}
setInterval(updateDateTime, 1000);
updateDateTime();


// =======================
// عرض التفاصيل عند الضغط على أي عنصر في الـ SVG
// =======================
function showDetails(name, type) {
  document.getElementById("detailName").textContent = name;

  let info = "";

  if (type === "dist") {
    info = `
      <b>نوع العنصر:</b> توزيع<br>
      <b>الاسم:</b> ${name}<br>
      <b>الحالة:</b> نشط<br>
      <b>ملاحظات:</b> لا توجد ملاحظات إضافية.
    `;
  }

  if (type === "line") {
    info = `
      <b>نوع العنصر:</b> خط<br>
      <b>الاسم:</b> ${name}<br>
      <b>الضغط:</b> 7.2 بار<br>
      <b>الحالة:</b> جاهز للتشغيل.
    `;
  }

  if (type === "pump") {
    info = `
      <b>نوع العنصر:</b> مضخة<br>
      <b>الاسم:</b> ${name}<br>
      <b>القدرة:</b> 15 kW<br>
      <b>الحالة:</b> نشطة.
    `;
  }

  document.getElementById("detailInfo").innerHTML = info;
}


// =======================
// تغيير اللغة
// =======================
document.getElementById("langAr").onclick = () => setLanguage("ar");
document.getElementById("langEn").onclick = () => setLanguage("en");

function setLanguage(lang) {
  if (lang === "ar") {
    document.getElementById("mapTitle").textContent = "المخطط الهندسي";
    document.getElementById("legendTitle").textContent = "وسيلة الإيضاح – وضع تشغيل الخطوط";
    document.getElementById("legendActive").textContent = "نشط";
    document.getElementById("legendStandby").textContent = "جاهز";
    document.getElementById("legendIdle").textContent = "خامل";

    document.getElementById("detailsTitle").textContent = "تفاصيل العنصر";
    document.getElementById("catalogTitle").textContent = "الكتالوج";
    document.getElementById("archiveTitle").textContent = "الأرشيف";
    document.getElementById("maintenanceTitle").textContent = "الصيانة";

    document.getElementById("langAr").classList.add("active");
    document.getElementById("langEn").classList.remove("active");
  }

  if (lang === "en") {
    document.getElementById("mapTitle").textContent = "Engineering Diagram";
    document.getElementById("legendTitle").textContent = "Legend – Line Status";
    document.getElementById("legendActive").textContent = "Active";
    document.getElementById("legendStandby").textContent = "Standby";
    document.getElementById("legendIdle").textContent = "Idle";

    document.getElementById("detailsTitle").textContent = "Details";
    document.getElementById("catalogTitle").textContent = "Catalog";
    document.getElementById("archiveTitle").textContent = "Archive";
    document.getElementById("maintenanceTitle").textContent = "Maintenance";

    document.getElementById("langEn").classList.add("active");
    document.getElementById("langAr").classList.remove("active");
  }
}
</script>
</div> <!-- END OF .dashboard -->

</body>
</html>
