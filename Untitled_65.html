<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Engineering Dashboard</title>

<style>
    :root {
        --bg-main: #181818;
        --bg-panel: #1F1F1F;
        --bg-header: linear-gradient(90deg, #0d0d0d, #262626);
        --bg-info: #222;
        --text-main: #ffffff;
        --text-muted: #dddddd;
        --accent: #42A5F5;
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg-main);
        font-family: Arial, sans-serif;
        color: var(--text-main);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* وضع نهاري */
    body.light-mode {
        --bg-main: #f4f4f4;
        --bg-panel: #ffffff;
        --bg-header: linear-gradient(90deg, #ffffff, #e9e9e9);
        --bg-info: #f0f0f0;
        --text-main: #111111;
        --text-muted: #333333;
        --accent: #1976D2;
    }

    /* الشريط العلوي */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background: var(--bg-header);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        z-index: 1000;
        border-bottom: 1px solid #333;
        animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
        from { transform: translateY(-80px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
    }

    .top-left,
    .top-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        height: 42px;
        width: 42px;
        border-radius: 8px;
        object-fit: contain;
        background: #000;
    }

    .title {
        font-size: 20px;
        font-weight: bold;
        color: var(--text-main);
        white-space: nowrap;
    }

    .btn {
        background: #333;
        color: #fff;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid #555;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s ease, transform 0.1s ease;
    }

    body.light-mode .btn {
        background: #e0e0e0;
        color: #111;
        border-color: #bbb;
    }

    .btn:hover {
        background: var(--accent);
        transform: translateY(-1px);
    }

    .btn-icon {
        font-size: 15px;
    }

    /* الشريط الثاني (الوقت والتاريخ) */
    .info-bar {
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        height: 40px;
        background: var(--bg-info);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        z-index: 999;
    }

    #datetime {
        letter-spacing: 0.5px;
    }

    /* حاوية المحتوى */
    .content-wrapper {
        margin-top: 120px;
        padding: 15px 20px 30px;
    }

    .panel {
        background: var(--bg-panel);
        border-radius: 10px;
        padding: 10px 10px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        overflow-x: auto;
    }

    /* SVG */
    svg {
        background: var(--bg-panel);
        border-radius: 8px;
    }

    /* مربعات */
    .box-green { fill:#4CAF50; stroke:#2E7D32; stroke-width:1.5; rx:6; ry:6; }
    .box-blue  { fill:#42A5F5; stroke:#1E88E5; stroke-width:1.5; rx:6; ry:6; }
    .box-peach { fill:#FFCC80; stroke:#FB8C00; stroke-width:1.5; rx:6; ry:6; }

    /* نصوص */
    .txt       { fill:#fff; font-size:12px; text-anchor:middle; }
    .txt-small { fill:#fff; font-size:11px; text-anchor:middle; }
    .title-svg { fill:#fff; font-size:22px; font-weight:bold; text-anchor:middle; }
    .side-label{ fill:#fff; font-size:16px; font-weight:bold; text-anchor:start; }

    body.light-mode .txt,
    body.light-mode .txt-small,
    body.light-mode .title-svg,
    body.light-mode .side-label {
        fill: #111;
    }

    /* خطوط التوصيل */
    .conn {
        stroke:#ddd;
        stroke-width:2;
        fill:none;
    }

    body.light-mode .conn {
        stroke:#555;
    }
</style>
</head>

<body>

<!-- الشريط العلوي -->
<div class="top-bar">
    <div class="top-left">
        <!-- ضع هنا صورة اللوقو الفعلي الذي أرسلته، بعد حفظه في نفس مجلد الملف -->
        <img src="logo.png" class="logo" alt="Logo">
        <div class="title">Engineering Building Distribution Dashboard</div>
    </div>
    <div class="top-right">
        <div class="btn" onclick="toggleLang()">
            <span class="btn-icon">🌐</span>
            <span id="lang-label">AR / EN</span>
        </div>
        <div class="btn" onclick="toggleMode()">
            <span class="btn-icon" id="mode-icon">🌙</span>
            <span id="mode-label">وضع ليلي</span>
        </div>
    </div>
</div>

<!-- الشريط الثاني (الوقت والتاريخ) -->
<div class="info-bar">
    <span id="datetime"></span>
</div>

<!-- المحتوى -->
<div class="content-wrapper">
    <div class="panel">
        <!-- SVG MAIN DIAGRAM -->
        <svg viewBox="0 0 1400 650" width="100%" height="650">

            <!-- العنوان داخل الـ SVG -->
            <text x="700" y="40" class="title-svg" id="svg-title">
                Building Distribution Flow Diagram
            </text>

            <!-- التسميات الجانبية -->
            <text x="40" y="135" class="side-label" id="lbl-locations">Locations</text>
            <text x="40" y="225" class="side-label" id="lbl-reducer">Lev. Reducer</text>
            <text x="40" y="315" class="side-label" id="lbl-lines">ID Lines</text>
            <text x="40" y="455" class="side-label" id="lbl-pumps">ID Pumps</text>

            <!-- Locations -->
            <rect x="180" y="100" width="140" height="60" class="box-green"/>
            <text x="250" y="130" class="txt-small">Center core</text>
            <text x="250" y="148" class="txt-small">(Slabs)</text>

            <rect x="380" y="100" width="140" height="60" class="box-green"/>
            <text x="450" y="130" class="txt-small">Wing C</text>
            <text x="450" y="148" class="txt-small">(SPB# 320043)</text>

            <rect x="580" y="100" width="160" height="60" class="box-green"/>
            <text x="660" y="130" class="txt-small">CC (TC3)</text>
            <text x="660" y="148" class="txt-small">(SPB# 320050)</text>

            <rect x="780" y="100" width="160" height="60" class="box-green"/>
            <text x="860" y="130" class="txt-small">CC (TC2)</text>
            <text x="860" y="148" class="txt-small">(SPB# 320051)</text>

            <rect x="1000" y="100" width="140" height="60" class="box-green"/>
            <text x="1070" y="130" class="txt-small">Wing A</text>
            <text x="1070" y="148" class="txt-small">(SPB# 320049)</text>

            <rect x="1200" y="100" width="140" height="60" class="box-green"/>
            <text x="1270" y="130" class="txt-small">Wing B</text>
            <text x="1270" y="148" class="txt-small">(SPB# 320048)</text>

            <!-- Reducers -->
            <rect x="210" y="190" width="80" height="50" class="box-blue"/>
            <text x="250" y="220" class="txt">L.75</text>

            <rect x="410" y="190" width="80" height="50" class="box-blue"/>
            <text x="450" y="220" class="txt">L.61</text>

            <rect x="610" y="190" width="80" height="50" class="box-blue"/>
            <text x="650" y="220" class="txt">L.73</text>

            <rect x="810" y="190" width="80" height="50" class="box-blue"/>
            <text x="850" y="220" class="txt">L.72</text>

            <rect x="1010" y="190" width="80" height="50" class="box-blue"/>
            <text x="1050" y="220" class="txt">L.62</text>

            <rect x="1210" y="190" width="80" height="50" class="box-blue"/>
            <text x="1250" y="220" class="txt">L.61</text>

            <!-- Lines -->
            <rect x="210" y="280" width="80" height="50" class="box-blue"/>
            <text x="250" y="310" class="txt">Line #1</text>

            <rect x="410" y="280" width="80" height="50" class="box-blue"/>
            <text x="450" y="310" class="txt">Line #2</text>

            <rect x="610" y="280" width="80" height="50" class="box-blue"/>
            <text x="650" y="310" class="txt">Line #3</text>

            <rect x="810" y="280" width="80" height="50" class="box-blue"/>
            <text x="850" y="310" class="txt">Line #4</text>

            <rect x="1010" y="280" width="80" height="50" class="box-blue"/>
            <text x="1050" y="310" class="txt">Line #5</text>

            <rect x="1210" y="280" width="80" height="50" class="box-blue"/>
            <text x="1250" y="310" class="txt">Line #6</text>

            <!-- Pumps -->
            <rect x="380" y="420" width="160" height="70" class="box-peach"/>
            <text x="460" y="450" class="txt-small">S.Pump (1)</text>
            <text x="460" y="468" class="txt-small">8800126</text>

            <rect x="580" y="420" width="160" height="70" class="box-peach"/>
            <text x="660" y="450" class="txt-small">S.Pump (2)</text>
            <text x="660" y="468" class="txt-small">8800121</text>

            <rect x="780" y="420" width="160" height="70" class="box-peach"/>
            <text x="860" y="450" class="txt-small">S.Pump (3)</text>
            <text x="860" y="468" class="txt-small">8800124</text>

            <rect x="980" y="420" width="160" height="70" class="box-peach"/>
            <text x="1060" y="450" class="txt-small">S.Pump (4)</text>
            <text x="1060" y="468" class="txt-small">8800127</text>

            <!-- خطوط التوصيل L-Shape -->

            <!-- Locations → Reducers -->
            <polyline class="conn" points="250,160 250,175 250,190"/>
            <polyline class="conn" points="450,160 450,175 450,190"/>
            <polyline class="conn" points="660,160 660,175 650,190"/>
            <polyline class="conn" points="860,160 860,175 850,190"/>
            <polyline class="conn" points="1070,160 1070,175 1050,190"/>
            <polyline class="conn" points="1270,160 1270,175 1250,190"/>

            <!-- Reducers → Lines -->
            <polyline class="conn" points="250,240 250,260 250,280"/>
            <polyline class="conn" points="450,240 450,260 450,280"/>
            <polyline class="conn" points="650,240 650,260 650,280"/>
            <polyline class="conn" points="850,240 850,260 850,280"/>
            <polyline class="conn" points="1050,240 1050,260 1050,280"/>
            <polyline class="conn" points="1250,240 1250,260 1250,280"/>

            <!-- Lines → Pumps -->
            <polyline class="conn" points="250,330 250,380 460,380 460,420"/>
            <polyline class="conn" points="450,330 450,380 460,380 460,420"/>

            <polyline class="conn" points="650,330 650,380 660,380 660,420"/>

            <polyline class="conn" points="850,330 850,380 860,380 860,420"/>
            <polyline class="conn" points="1050,330 1050,380 860,380 860,420"/>

            <polyline class="conn" points="1250,330 1250,380 1060,380 1060,420"/>

        </svg>
    </div>
</div>

<script>
function updateDateTime() {
    const now = new Date();
    const options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    };
    document.getElementById("datetime").textContent =
        now.toLocaleString(document.documentElement.lang === 'ar' ? 'ar-SA' : 'en-US', options);
}

setInterval(updateDateTime, 1000);
updateDateTime();

function toggleLang() {
    const html = document.documentElement;
    const svgTitle = document.getElementById('svg-title');
    const lblLoc = document.getElementById('lbl-locations');
    const lblRed = document.getElementById('lbl-reducer');
    const lblLines = document.getElementById('lbl-lines');
    const lblPumps = document.getElementById('lbl-pumps');
    const langLabel = document.getElementById('lang-label');

    if (html.dir === 'rtl') {
        html.dir = 'ltr';
        html.lang = 'en';
        svgTitle.textContent = 'Building Distribution Flow Diagram';
        lblLoc.textContent = 'Locations';
        lblRed.textContent = 'Lev. Reducer';
        lblLines.textContent = 'ID Lines';
        lblPumps.textContent = 'ID Pumps';
        langLabel.textContent = 'EN / AR';
    } else {
        html.dir = 'rtl';
        html.lang = 'ar';
        svgTitle.textContent = 'مخطط توزيع المبنى';
        lblLoc.textContent = 'المواقع';
        lblRed.textContent = 'مخفّض المناسيب';
        lblLines.textContent = 'خطوط التعريف';
        lblPumps.textContent = 'مضخات التعريف';
        langLabel.textContent = 'AR / EN';
    }

    updateDateTime();
}

function toggleMode() {
    const body = document.body;
    const modeIcon = document.getElementById('mode-icon');
    const modeLabel = document.getElementById('mode-label');

    body.classList.toggle('light-mode');

    if (body.classList.contains('light-mode')) {
        modeIcon.textContent = '☀️';
        modeLabel.textContent = 'وضع نهاري';
    } else {
        modeIcon.textContent = '🌙';
        modeLabel.textContent = 'وضع ليلي';
    }
}
</script>

</body>
</html>
