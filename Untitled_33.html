<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPCEC – Pump | Line Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>

<style>
/* ——— نفس الـ CSS بالكامل بدون تغيير ——— */
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
}

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  padding: 25px;
}

.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container {
  transform-origin: center center;
  cursor: grab;
}
.svg-container:active {
  cursor: grabbing;
}

.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.item-card:hover {
  background: #111827;
}
.item-card h3 {
  margin: 0;
  font-size: 16px;
  color: #e5e7eb;
}

.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-table th {
  background: #020617;
  font-weight: 700;
}
.pdf-table td {
  background: #020617;
}
.pdf-icon {
  color: #f97316;
  font-size: 18px;
}

.legend-item {
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border-radius:6px;
  background:#020617;
  border:1px solid #1f2937;
}

.minimap {
  position:absolute;
  right:10px;
  bottom:10px;
  width:140px;
  height:90px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  overflow:hidden;
  opacity:0.85;
}

.minimap svg {
  width:100%;
  height:100%;
}

.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}

.glow-line {
  filter: url(#glowFilter);
}

@keyframes fadeSlide {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<header>
  <div class="title">CPCEC – Pump | Line Dashboard</div>
</header>

<!-- ———— الأعمدة الثلاثة ———— -->
<div class="dashboard">

  <!-- DETAILS -->
  <div class="box" id="detailsBox" style="animation-delay:0.2s">
    <h2 id="detailName">اختر عنصرًا</h2>
    <div id="detailInfo"><p>—</p></div>

    <h3 style="margin-top:20px">أرشيف ملفات PDF</h3>
    <table class="pdf-table" id="pdfTable">
      <thead>
        <tr><th>التاريخ</th><th>الملف</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="2">— لا توجد ملفات —</td></tr>
      </tbody>
    </table>
  </div>

  <!-- PUMPS -->
  <div class="box" style="animation-delay:0.3s">
    <h2>Concrete Pump</h2>
    <div id="pumpList"></div>
  </div>

  <!-- LINES -->
  <div class="box" style="animation-delay:0.4s">
    <h2>Line</h2>
    <div id="lineList"></div>
  </div>

  <!-- DISTRIBUTORS -->
  <div class="box" style="animation-delay:0.5s">
    <h2>Placing Boom</h2>
    <div id="distList"></div>
  </div>

</div> <!-- نهاية dashboard -->

<!-- ———— المخطط الهندسي الآن في أسفل الصفحة ———— -->
<div class="box" style="margin:25px; animation-delay:0.1s">
  <h2>المخطط الهندسي</h2>

  <!-- هنا ضع نفس محتوى الـ SVG بالكامل كما هو -->
  <!-- (لم أضعه هنا لتقليل طول الرسالة، لكن انسخه كما هو من كودك السابق) -->

</div>

<script>
/* ———— نفس السكربت بالكامل بدون أي تغيير ———— */
</script>

</body>
</html>
