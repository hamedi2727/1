<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPCEC – Pump | Line Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
/* ============================
   GLOBAL STYLE
============================ */
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
}

/* ============================
   NEW GRID LAYOUT
============================ */
.dashboard {
  display: grid;
  grid-template-columns: 350px 1fr; /* يسار ثم يمين */
  gap: 20px;
  padding: 25px;
}

.left-column {
  display: block;
}

.right-column {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ============================
   BOX STYLE
============================ */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

/* ============================
   SVG WRAPPER
============================ */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container {
  transform-origin: center center;
  cursor: grab;
}
.svg-container:active {
  cursor: grabbing;
}

/* ============================
   LIST CARDS
============================ */
.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.item-card:hover {
  background: #111827;
}
.item-card h3 {
  margin: 0;
  font-size: 16px;
  color: #e5e7eb;
}

/* ============================
   PDF TABLE
============================ */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-table th {
  background: #020617;
  font-weight: 700;
}
.pdf-table td {
  background: #020617;
}
.pdf-icon {
  color: #f97316;
  font-size: 18px;
}

/* ============================
   MINIMAP
============================ */
.minimap {
  position:absolute;
  right:10px;
  bottom:10px;
  width:140px;
  height:90px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  overflow:hidden;
  opacity:0.85;
}
.minimap svg {
  width:100%;
  height:100%;
}
.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}

/* ============================
   ANIMATIONS
============================ */
.glow-line {
  filter: url(#glowFilter);
}

@keyframes fadeSlide {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.legend-box {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(2, 6, 23, 0.65);
  border: 1px solid #1f2937;
  border-radius: 10px;
  backdrop-filter: blur(6px);
  width: fit-content;
  margin-bottom: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #e5e7eb;
}

.legend-color {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid #1f2937;
}
</style>
</head>

<body>

<header>
  <div class="title">CPCEC – Pump | Line Dashboard</div>
</header>

<!-- ============================
     DASHBOARD (NEW STRUCTURE)
============================ -->
<div class="dashboard">

  <!-- LEFT COLUMN -->
  <div class="left-column">
    <div class="box" id="detailsBox" style="animation-delay:0.2s">
      <h2 id="detailName">اختر عنصرًا</h2>
      <div id="detailInfo"><p>—</p></div>

      <h3 style="margin-top:20px">أرشيف ملفات PDF</h3>
      <table class="pdf-table" id="pdfTable">
        <thead>
          <tr><th>التاريخ</th><th>الملف</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="2">— لا توجد ملفات —</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-column">

    <!-- PUMPS -->
    <div class="box" style="animation-delay:0.3s">
      <h2>Concrete Pump</h2>
      <div id="pumpList"></div>
    </div>

    <!-- LINES -->
    <div class="box" style="animation-delay:0.4s">
      <h2>Line</h2>
      <div id="lineList"></div>
    </div>

    <!-- DISTRIBUTORS -->
    <div class="box" style="animation-delay:0.5s">
      <h2>Placing Boom</h2>
      <div id="distList"></div>
    </div>

    <!-- ENGINEERING MAP -->
    <div class="box" style="animation-delay:0.1s; margin-top:20px;">
      <h2>المخطط الهندسي</h2>

      <div class="svg-wrapper" id="svgWrapper" style="margin-top:10px; height:360px; position:relative;">

        <div class="legend-box">
          <div class="legend-item">
            <div class="legend-color" style="background:#22c55e"></div>
            <span>ACTIVE</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#eab308"></div>
            <span>STANDBY</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#6b7280"></div>
            <span>Idle</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#ef4444"></div>
            <span>Ready</span>
          </div>
        </div>

        <div class="svg-container" id="svgContainer" style="width:100%; height:100%; transform:scale(1) translate(0px,0px);">

          <!-- ============================
               FULL SVG MAP
          ============================ -->
          <svg id="mainSvg" width="100%" height="100%" viewBox="0 0 800 350">

            <defs>
              <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
              </pattern>

              <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z" fill="currentColor"/>
              </marker>
            </defs>

            <rect width="100%" height="100%" fill="url(#grid)" opacity="0.25"/>

            <!-- PUMPS -->
            <g id="P1" onclick="showDetails('P1','pump')" style="cursor:pointer">
              <rect x="50" y="250" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
              <rect x="50"  y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
              <text x="90" y="275" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P1</text>
            </g>

            <g id="P2" onclick="showDetails('P2','pump')" style="cursor:pointer">
              <rect x="200" y="250" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
              <text x="240" y="275" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P2</text>
            </g>

            <g id="P3" onclick="showDetails('P3','pump')" style="cursor:pointer">
              <rect x="350" y="250" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
              <text x="390" y="275" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P3</text>
            </g>

            <g id="P4" onclick="showDetails('P4','pump')" style="cursor:pointer">
              <rect x="500" y="250" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
              <text x="540" y="275" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P4</text>
            </g>

            <!-- LINES -->
            <g id="G_L1" onclick="showDetails('L1','line')" style="cursor:pointer">
              <path id="L1" d="M90 200 L90 130 L150 130 L150 90"
                    stroke-width="6" fill="none" color="#22c55e" marker-end="url(#arrowHead)"/>
            </g>

            <g id="G_L2" onclick="showDetails('L2','line')" style="cursor:pointer">
              <path id="L2" d="M240 200 L240 130 L300 130 L300 90"
                    stroke-width="6" fill="none" color="#eab308" marker-end="url(#arrowHead)"/>
            </g>

            <g id="G_L3" onclick="showDetails('L3','line')" style="cursor:pointer">
              <path id="L3" d="M390 200 L390 130 L450 130 L450 90"
                    stroke-width="6" fill="none" color="#6b7280" marker-end="url(#arrowHead)"/>
            </g>

            <g id="G_L4" onclick="showDetails('L4','line')" style="cursor:pointer">
              <path id="L4" d="M540 200 L540 130 L600 130 L600 90"
                    stroke-width="6" fill="none" color="#ef4444" marker-end="url(#arrowHead)"/>
            </g>

            <!-- DISTRIBUTORS -->
            <circle id="D1" cx="150" cy="70" r="16" fill="#f97316" onclick="showDetails('D1','dist')" style="cursor:pointer"/>
            <circle id="D2" cx="300" cy="70" r="16" fill="#f97316" onclick="showDetails('D2','dist')" style="cursor:pointer"/>
            <circle id="D3" cx="450" cy="70" r="16" fill="#f97316" onclick="showDetails('D3','dist')" style="cursor:pointer"/>
            <circle id="D4" cx="600" cy="70" r="16" fill="#f97316" onclick="showDetails('D4','dist')" style="cursor:pointer"/>
            <circle id="D5" cx="750" cy="70" r="16" fill="#f97316" onclick="showDetails('D5','dist')" style="cursor:pointer"/>

          </svg>

        </div>

        <!-- MINIMAP -->
        <div class="minimap">
          <svg viewBox="0 0 800 350">
            <rect x="50"  y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
            <rect x="200" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
            <rect x="350" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
            <rect x="500" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>

            <path d="M90 300 L90 160 L150 130 L150 90" stroke="#22c55e" stroke-width="4" fill="none" opacity="0.5"/>
            <path d="M240 300 L240 130 L300 130 L300 90" stroke="#eab308" stroke-width="4" fill="none" opacity="0.5"/>
            <path d="M390 300 L390 130 L450 130 L450 90" stroke="#6b7280" stroke-width="4" fill="none" opacity="0.5"/>
            <path d="M540 300 L540 130 L600 130 L600 90" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.5"/>

            <circle cx="150" cy="70" r="16" fill="#f97316" opacity="0.5"/>
            <circle cx="300" cy="70" r="16" fill="#f97316" opacity="0.5"/>
            <circle cx="450" cy="70" r="16" fill="#f97316" opacity="0.5"/>
            <circle cx="600" cy="70" r="16" fill="#f97316" opacity="0.5"/>
            <circle cx="750" cy="70" r="16" fill="#f97316" opacity="0.5"/>

            <rect id="minimapViewport" class="minimap-viewport" x="0" y="0" width="200" height="80"/>
          </svg>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- ============================
     JAVASCRIPT SECTION
============================ -->
<script>

/* =======================
   DATA
======================= */

const pumps = [
  { id: "P1", name: "P1-8800126" },
  { id: "P2", name: "P2-8800121" },
  { id: "P3", name: "P3-8800124" },
  { id: "P4", name: "P4-8800127" }
];

const lines = [
  { id: "L1", name: "01", mode: "ACTIVE" },
  { id: "L2", name: "02", mode: "STANDBY" },
  { id: "L3", name: "03", mode: "Idle" },
  { id: "L4", name: "04", mode: "Ready" },
  { id: "L5", name: "05", mode: "ACTIVE" },
  { id: "L6", name: "06", mode: "STANDBY" }
];

const distributors = [
  { id: "D1", name: "320043" },
  { id: "D2", name: "320048" },
  { id: "D3", name: "320049" },
 
  { id: "D4", name: "320050
  { id: "D5", name: "320051" }
];

/* =======================
   CONNECTIONS
======================= */

const pumpToLines = {
  P1: ["L1", "L3"],
  P2: ["L2"],
  P3: ["L5"],
  P4: ["L4", "L6"]
};

const lineToDist = {
  L1: "D1",
  L2: "D2",
  L3: "D3",
  L4: "D4",
  L5: "D2",
  L6: "D3"
};

/* =======================
   PDF ARCHIVE
======================= */

const pdfArchive = {
  P1: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P2: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P3: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P4: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  L1: [], L2: [], L3: [], L4: [], L5: [], L6: [],
  D1: [], D2: [], D3: [], D4: [], D5: []
};

/* =======================
   COLOR BY MODE
======================= */

function getLineColor(mode) {
  switch (mode) {
    case "ACTIVE": return "#22c55e";
    case "STANDBY": return "#eab308";
    case "Idle": return "#6b7280";
    case "Ready": return "#ef4444";
    default: return "#22c55e";
  }
}

function applyLineColors() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.setAttribute("stroke", getLineColor(l.mode));
      el.style.opacity = 1.25;
    }
  });
}

/* =======================
   RENDER LISTS
======================= */

function renderLists() {
  const pumpList = document.getElementById("pumpList");
  const lineList = document.getElementById("lineList");
  const distList = document.getElementById("distList");

  pumps.forEach(p => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${p.name}</h3>`;
    card.onclick = () => showDetails(p.id, "pump");
    pumpList.appendChild(card);
  });

  lines.forEach(l => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${l.name} – ${l.mode}</h3>`;
    card.onclick = () => showDetails(l.id, "line");
    lineList.appendChild(card);
  });

  distributors.forEach(d => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${d.name}</h3>`;
    card.onclick = () => showDetails(d.id, "dist");
    distList.appendChild(card);
  });
}

/* =======================
   HIGHLIGHT + GSAP
======================= */

function resetHighlight() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.style.opacity = 0.25;
      el.setAttribute("stroke-width", 6);
      el.classList.remove("glow-line");
    }
  });

  distributors.forEach(d => {
    const el = document.getElementById(d.id);
    if (el) el.style.opacity = 0.5;
  });

  pumps.forEach(p => {
    const el = document.getElementById(p.id);
    if (el) el.style.opacity = 1;
  });
}

function highlightElement(id, type) {
  if (type === "pump") {
    const el = document.getElementById(id);
    el.style.opacity = 1;
    gsap.fromTo(el, { scale: 1 }, { scale: 1.06, duration: 0.25 });
  }

  if (type === "line") {
    const el = document.getElementById(id);
    el.style.opacity = 1;
    el.setAttribute("stroke-width", 8);
    el.classList.add("glow-line");
  }

  if (type === "dist") {
    const el = document.getElementById(id);
    el.style.opacity = 1;
    gsap.fromTo(el, { scale: 1 }, { scale: 1.08, duration: 0.25 });
  }
}

/* =======================
   SHOW DETAILS
======================= */

function showDetails(id, type) {

  document.getElementById("detailName").textContent =
    type === "pump" ? `المضخة ${pumps.find(x => x.id === id).name}` :
    type === "line" ? `الخط ${lines.find(x => x.id === id).name}` :
    `الموزع ${distributors.find(x => x.id === id).name}`;

  let extraInfo = "";
  if (type === "line") {
    const lineObj = lines.find(x => x.id === id);
    extraInfo = `<p>وضع التشغيل: ${lineObj.mode}</p>`;
  }

  document.getElementById("detailInfo").innerHTML = `
    <p>نوع العنصر: ${
      type === "pump" ? "مضخة" :
      type === "line" ? "خط" :
      "موزع"
    }</p>
    <p>المعرف: ${id}</p>
    ${extraInfo}
  `;

  const tableBody = document.querySelector("#pdfTable tbody");
  tableBody.innerHTML = "";

  const files = pdfArchive[id] || [];

  if (!files || files.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="2">— لا توجد ملفات PDF —</td></tr>`;
  } else {
    files.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${f.date}</td>
        <td><a href="${f.url}" target="_blank" class="pdf-icon">📄</a></td>
      `;
      tableBody.appendChild(tr);
    });
  }

  resetHighlight();

  if (type === "pump") {
    highlightElement(id, "pump");

    const relatedLines = pumpToLines[id] || [];
    relatedLines.forEach(lid => {
      highlightElement(lid, "line");
      const distId = lineToDist[lid];
      if (distId) highlightElement(distId, "dist");
    });
  }

  if (type === "line") {
    highlightElement(id, "line");
    const distId = lineToDist[id];
    if (distId) highlightElement(distId, "dist");
  }

  if (type === "dist") {
    highlightElement(id, "dist");
    Object.entries(lineToDist).forEach(([lid, did]) => {
      if (did === id) highlightElement(lid, "line");
    });
  }
}

/* =======================
   ZOOM + PAN + MINIMAP
======================= */

let currentScale = 1;
let currentTranslate = { x: 0, y: 0 };
let isPanning = false;
let startPan = { x: 0, y: 0 };

const svgContainer = document.getElementById("svgContainer");
const svgWrapper = document.getElementById("svgWrapper");
const minimapViewport = document.getElementById("minimapViewport");

function updateTransform() {
  svgContainer.style.transform =
    `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentScale})`;
  updateMinimapViewport();
}

function updateMinimapViewport() {
  const viewW = 800 / currentScale;
  const viewH = 260 / currentScale;
  const offsetX = -currentTranslate.x * (800 / svgWrapper.clientWidth) / currentScale;
  const offsetY = -currentTranslate.y * (260 / svgWrapper.clientHeight) / currentScale;

  minimapViewport.setAttribute("width", viewW);
  minimapViewport.setAttribute("height", viewH);
  minimapViewport.setAttribute("x", offsetX);
  minimapViewport.setAttribute("y", offsetY);
}

svgWrapper.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.1 : -0.1;
  const newScale = Math.min(2.5, Math.max(0.7, currentScale + delta));
  currentScale = newScale;
  updateTransform();
});

svgWrapper.addEventListener("mousedown", (e) => {
  isPanning = true;
  startPan = { x: e.clientX - currentTranslate.x, y: e.clientY - currentTranslate.y };
});

window.addEventListener("mousemove", (e) => {
  if (!isPanning) return;
  currentTranslate.x = e.clientX - startPan.x;
  currentTranslate.y = e.clientY - startPan.y;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isPanning = false;
});

/* =======================
   INIT
======================= */

renderLists();
applyLineColors();
resetHighlight();
updateTransform();

</script>

</body>
</html>
