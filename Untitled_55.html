<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPC - REC | Operations Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>

<style>
/* =======================
   GLOBAL STYLE
======================= */
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* =======================
   HEADER
======================= */
header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
}
.lang-switch {
  display:flex;
  gap:8px;
}
.lang-switch button {
  padding:6px 12px;
  border-radius:6px;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer;
  font-size:13px;
}
.lang-switch button.active {
  background:#0ea5e9;
  border-color:#38bdf8;
}

/* =======================
   LAYOUT GRID
======================= */
.dashboard {
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  gap: 20px;
  padding: 25px;
}

/* =======================
   BOXES
======================= */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
}

/* =======================
   LIST GRIDS
======================= */
#pumpList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
#lineList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
#distList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* =======================
   ITEM CARDS
======================= */
.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: 0.2s;
  text-align:center;
}
.item-card:hover { background: #111827; }
.item-card h3 { margin: 0; font-size: 16px; }

/* =======================
   SVG AREA
======================= */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container { transform-origin: center center; cursor: grab; }
.svg-container:active { cursor: grabbing; }

/* =======================
   PDF TABLE
======================= */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-icon { font-size: 18px; color: #f97316; }

/* =======================
   MINIMAP
======================= */
.minimap {
  position:absolute;
  right:10px;
  bottom:10px;
  width:140px;
  height:90px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  overflow:hidden;
  opacity:0.85;
}
.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}

/* =======================
   ANIMATION
======================= */
@keyframes fadeSlide {
  to { opacity: 1; transform: translateY(0); }
}

.datetime-bar {
  background: #0f172a;
  border-bottom: 1px solid #1f2937;
  padding: 8px 25px;
  font-size: 15px;
  direction:ltr;
}
</style>
</head>
<body>

<header>
  <div class="title">CPC - REC | Operations Dashboard</div>

  <div class="lang-switch">

    <!-- 🔵 NEW BOX: تشغيل التشغيل -->

    </div>

  </div>
    <!-- LEFT COLUMN -->
  <div class="box" id="detailsBox" style="animation-delay:0.2s">
    <h2 id="detailName">اختر عنصرًا</h2>

    <div id="detailInfo"><p>—</p></div>

    <!-- 🔵 3 NEW CARDS -->
    <div style="display:flex; gap:10px; margin:10px 0; flex-wrap:wrap;">
      <div class="item-card"><div style="font-size:22px;">🔒</div><div>التأمين</div></div>
      <div class="item-card"><div style="font-size:22px;">📘</div><div>الكتالوج</div></div>
      <div class="item-card"><div style="font-size:22px;">📑</div><div>المواصفات</div></div>
    </div>

    <h3 id="pdfTitle" style="margin-top:20px">أرشيف ملفات PDF</h3>

    <table class="pdf-table" id="pdfTable">
      <thead>
        <tr><th id="pdfDateHeader">التاريخ</th><th id="pdfFileHeader">الملف</th></tr>
      </thead>
      <tbody><tr><td colspan="2">— لا توجد ملفات —</td></tr></tbody>
    </table>
  </div>

</div> <!-- END DASHBOARD -->
