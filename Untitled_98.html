<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>CPC - REC | Operations Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* HEADER */
.fixed-header {
  direction: ltr !important;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  direction: ltr !important;
}
.header-logo {
  height: 60px;
  object-fit: contain;
}
.title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
  direction: rtl;
}
.lang-switch {
  display:flex;
  gap:8px;
  direction:ltr !important;
}
.lang-switch button {
  padding:6px 12px;
  border-radius:6px;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer;
  font-size:13px;
}
.lang-switch button.active {
  background:#0ea5e9;
  border-color:#38bdf8;
}

/* GRID */
.dashboard {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-auto-rows: auto;
  align-items: start;
  gap: 20px;
  padding: 25px;
}
/* BOX */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
#detailsBox {
  height: auto !important;
  max-height: fit-content !important;
  display: block !important;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

/* SVG WRAPPER */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container { transform-origin: center center; cursor: grab; }
.svg-container:active { cursor: grabbing; }

/* LEGEND */
.legend-item {
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border-radius:6px;
  background:#020617;
  border:1px solid #1f2937;
}

/* PDF TABLE */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-icon { color: #f97316; font-size: 18px; }

/* ICON BUTTONS */
.doc-icons {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
}
.doc-btn {
  flex:1;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  padding:8px 6px;
  text-align:center;
  cursor:pointer;
  transition:0.25s;
}
.doc-btn:hover {
  background:#0f172a;
  transform:translateY(-3px);
}
.doc-btn div {
  font-size:12px;
  margin-bottom:4px;
}
.doc-btn span {
  font-size:12px;
  opacity:0.85;
}

/* ANIMATION */
@keyframes fadeSlide {
  to { opacity: 1; transform: translateY(0); }
}

/* DATETIME BAR */
.datetime-bar {
  background: #0f172a;
  border-bottom: 1px solid #1f2937;
  padding: 8px 25px;
  font-size: 15px;
  direction:ltr;
}
</style>
</head>

<script>
// =========================
//     الترجمة
// =========================
const translations = {
  ar: {
    mapTitle: "المخطط الهندسي",
    legendActive: "نشط",
    legendStandby: "جاهز",
    legendIdle: "خامل",
    detailsTitle: "تفاصيل العنصر",
    type: "النوع",
    id: "المعرف",
    pumpLabel: "مضخة",
    lineLabel: "خط",
    distLabel: "موزع",
    mode: "الوضع"
  },
  en: {
    mapTitle: "Engineering Diagram",
    legendActive: "Active",
    legendStandby: "Ready",
    legendIdle: "Idle",
    detailsTitle: "Item Details",
    type: "Type",
    id: "ID",
    pumpLabel: "Pump",
    lineLabel: "Line",
    distLabel: "Distributor",
    mode: "Mode"
  }
};

let currentLang = "ar";

document.getElementById("langAr").onclick = () => switchLang("ar");
document.getElementById("langEn").onclick = () => switchLang("en");

function switchLang(lang) {
  currentLang = lang;

  document.getElementById("langAr").classList.toggle("active", lang === "ar");
  document.getElementById("langEn").classList.toggle("active", lang === "en");

  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", lang);

  const t = translations[lang];

  document.getElementById("mapTitle").textContent = t.mapTitle;
  document.getElementById("legendActive").textContent = t.legendActive;
  document.getElementById("legendStandby").textContent = t.legendStandby;
  document.getElementById("legendIdle").textContent = t.legendIdle;
  document.getElementById("detailsTitle").textContent = t.detailsTitle;

  if (selectedItem) {
    showDetails(selectedItem.id, selectedItem.type);
  }
}

// =========================
//   بيانات الخطوط والمضخات
// =========================
const lines = [
  { id: "L1", name: "L1", mode: "ACTIVE" },
  { id: "L2", name: "L2", mode: "Ready" },
  { id: "L3", name: "L3", mode: "Idle" },
  { id: "L4", name: "L4", mode: "Ready" },
  { id: "L5", name: "L5", mode: "ACTIVE" },
  { id: "L6", name: "L6", mode: "Ready" }
];

const pumps = [
  { id: "P1", name: "P1" },
  { id: "P2", name: "P2" },
  { id: "P3", name: "P3" },
  { id: "P4", name: "P4" }
];

const distributors = [
  { id: "Center core 1", name: "Center core 1" },
  { id: "Wing C", name: "Wing C" },
  { id: "Center core 2", name: "Center core 2" },
  { id: "Wing A", name: "Wing A" },
  { id: "Wing B", name: "Wing B" },
  { id: "Wing B 2", name: "Wing B 2" }
];

let selectedItem = null;

// =========================
//   إظهار التفاصيل
// =========================
function showDetails(id, type) {
  selectedItem = { id, type };
  const t = translations[currentLang];

  let title = "";
  let extra = "";
  let catalog = `${id}-catalog.pdf`;
  let spec = `${id}-spec.pdf`;
  let drawings = `${id}-drawings.pdf`;

  if (type === "pump") {
    const obj = pumps.find(x => x.id === id);
    title = `${t.pumpLabel} ${obj.id}`;
    extra = `<p>الرقم: ${obj.name}</p>`;
  }

  if (type === "line") {
    const obj = lines.find(x => x.id === id);
    title = `${t.lineLabel} ${obj.id}`;
    extra = `<p>${t.mode}: ${obj.mode}</p>`;
  }

  if (type === "dist") {
    const obj = distributors.find(x => x.id === id);
    title = `${t.distLabel} ${obj.id}`;
    extra = `<p>الرقم: ${obj.name}</p>`;
  }

  document.getElementById("detailName").textContent = title;

  document.getElementById("detailInfo").innerHTML = `
    <p>${t.type}: ${type}</p>
    <p>${t.id}: ${id}</p>
    ${extra}
  `;

  // BOX 2 — CATALOG
  document.getElementById("catalogContent").innerHTML = `
    <div class="doc-icons">
      <div class="doc-btn" onclick="window.open('${catalog}','_blank')">
        <div>📘</div>
        <span>الكتالوج</span>
      </div>

      <div class="doc-btn" onclick="window.open('${spec}','_blank')">
        <div>📑</div>
        <span>المواصفات</span>
      </div>

      <div class="doc-btn" onclick="window.open('${drawings}','_blank')">
        <div>📐</div>
        <span>الرسومات</span>
      </div>
    </div>
  `;

  renderArchiveTable(id);
  renderMaintenanceTable(id);
}

// =========================
//   جدول الأرشيف (3 ملفات فقط)
// =========================
function renderArchiveTable(id) {

  const pdfArchive = {
    P1: { archive: [
