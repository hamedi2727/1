<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Diagram Clean</title>
<style>
  body {
    margin:0;
    background:#181818;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  svg {
    background:#1F1F1F;
  }
  .box-green { fill:#4CAF50; stroke:#2E7D32; stroke-width:1.5; rx:6; ry:6; }
  .box-blue  { fill:#42A5F5; stroke:#1E88E5; stroke-width:1.5; rx:6; ry:6; }
  .box-peach { fill:#FFCC80; stroke:#FB8C00; stroke-width:1.5; rx:6; ry:6; }
  .txt       { fill:#fff; font-size:12px; text-anchor:middle; }
  .txt-small { fill:#fff; font-size:11px; text-anchor:middle; }
  .title     { fill:#fff; font-size:22px; font-weight:bold; text-anchor:middle; }
  .side-label{ fill:#fff; font-size:16px; font-weight:bold; text-anchor:start; }
  .conn      { stroke:#ddd; stroke-width:2; fill:none; }
</style>
</head>
<body>

<svg viewBox="0 0 1400 650" width="1400" height="650">

  <!-- عنوان -->
  <text x="700" y="40" class="title">Building Distribution Flow Diagram</text>

  <!-- التسميات الجانبية (محاذاة دقيقة مع الصفوف) -->
  <text x="40" y="135" class="side-label">Locations</text>
  <text x="40" y="225" class="side-label">Lev. Reducer</text>
  <text x="40" y="315" class="side-label">ID Lines</text>
  <text x="40" y="455" class="side-label">ID Pumps</text>

  <!-- الصف 1: Locations -->
  <rect x="180" y="100" width="140" height="60" class="box-green"/>
  <text x="250" y="130" class="txt-small">Center core</text>
  <text x="250" y="148" class="txt-small">(Slabs)</text>

  <rect x="380" y="100" width="140" height="60" class="box-green"/>
  <text x="450" y="130" class="txt-small">Wing C</text>
  <text x="450" y="148" class="txt-small">(SPB# 320043)</text>

  <rect x="580" y="100" width="160" height="60" class="box-green"/>
  <text x="660" y="130" class="txt-small">CC (TC3)</text>
  <text x="660" y="148" class="txt-small">(SPB# 320050)</text>

  <rect x="780" y="100" width="160" height="60" class="box-green"/>
  <text x="860" y="130" class="txt-small">CC (TC2)</text>
  <text x="860" y="148" class="txt-small">(SPB# 320051)</text>

  <rect x="1000" y="100" width="140" height="60" class="box-green"/>
  <text x="1070" y="130" class="txt-small">Wing A</text>
  <text x="1070" y="148" class="txt-small">(SPB# 320049)</text>

  <rect x="1200" y="100" width="140" height="60" class="box-green"/>
  <text x="1270" y="130" class="txt-small">Wing B</text>
  <text x="1270" y="148" class="txt-small">(SPB# 320048)</text>

  <!-- الصف 2: Lev. Reducer -->
  <rect x="210" y="190" width="80" height="50" class="box-blue"/>
  <text x="250" y="220" class="txt">L.75</text>

  <rect x="410" y="190" width="80" height="50" class="box-blue"/>
  <text x="450" y="220" class="txt">L.61</text>

  <rect x="610" y="190" width="80" height="50" class="box-blue"/>
  <text x="650" y="220" class="txt">L.73</text>

  <rect x="810" y="190" width="80" height="50" class="box-blue"/>
  <text x="850" y="220" class="txt">L.72</text>

  <rect x="1010" y="190" width="80" height="50" class="box-blue"/>
  <text x="1050" y="220" class="txt">L.62</text>

  <rect x="1210" y="190" width="80" height="50" class="box-blue"/>
  <text x="1250" y="220" class="txt">L.61</text>

  <!-- الصف 3: ID Lines -->
  <rect x="210" y="280" width="80" height="50" class="box-blue"/>
  <text x="250" y="310" class="txt">Line #1</text>

  <rect x="410" y="280" width="80" height="50" class="box-blue"/>
  <text x="450" y="310" class="txt">Line #2</text>

  <rect x="610" y="280" width="80" height="50" class="box-blue"/>
  <text x="650" y="310" class="txt">Line #3</text>

  <rect x="810" y="280" width="80" height="50" class="box-blue"/>
  <text x="850" y="310" class="txt">Line #4</text>

  <rect x="1010" y="280" width="80" height="50" class="box-blue"/>
  <text x="1050" y="310" class="txt">Line #5</text>

  <rect x="1210" y="280" width="80" height="50" class="box-blue"/>
  <text x="1250" y="310" class="txt">Line #6</text>

  <!-- الصف 4: ID Pumps -->
  <rect x="380" y="420" width="160" height="70" class="box-peach"/>
  <text x="460" y="450" class="txt-small">S.Pump (1)</text>
  <text x="460" y="468" class="txt-small">8800126</text>

  <rect x="580" y="420" width="160" height="70" class="box-peach"/>
  <text x="660" y="450" class="txt-small">S.Pump (2)</text>
  <text x="660" y="468" class="txt-small">8800121</text>

  <rect x="780" y="420" width="160" height="70" class="box-peach"/>
  <text x="860" y="450" class="txt-small">S.Pump (3)</text>
  <text x="860" y="468" class="txt-small">8800124</text>

  <rect x="980" y="420" width="160" height="70" class="box-peach"/>
  <text x="1060" y="450" class="txt-small">S.Pump (4)</text>
  <text x="1060" y="468" class="txt-small">8800127</text>

  <!-- خطوط الربط بين الصفوف (متصلة) -->

  <!-- Locations -> Reducers -->
  <line x1="250" y1="160" x2="250" y2="190" class="conn"/>
  <line x1="450" y1="160" x2="450" y2="190" class="conn"/>
  <line x1="660" y1="160" x2="650" y2="190" class="conn"/>
  <line x1="860" y1="160" x2="850" y2="190" class="conn"/>
  <line x1="1070" y1="160" x2="1050" y2="190" class="conn"/>
  <line x1="1270" y1="160" x2="1250" y2="190" class="conn"/>

  <!-- Reducers -> Lines -->
  <line x1="250" y1="240" x2="250" y2="280" class="conn"/>
  <line x1="450" y1="240" x2="450" y2="280" class="conn"/>
  <line x1="650" y1="240" x2="650" y2="280" class="conn"/>
  <line x1="850" y1="240" x2="850" y2="280" class="conn"/>
  <line x1="1050" y1="240" x2="1050" y2="280" class="conn"/>
  <line x1="1250" y1="240" x2="1250" y2="280" class="conn"/>

  <!-- Lines -> Pumps (مثال توصيل مركزي) -->
  <line x1="250" y1="330" x2="460" y2="420" class="conn"/>
  <line x1="450" y1="330" x2="460" y2="420" class="conn"/>

  <line x1="650" y1="330" x2="660" y2="420" class="conn"/>
  <line x1="850" y1="330" x2="860" y2="420" class="conn"/>

  <line x1="1050" y1="330" x2="1060" y2="420" class="conn"/>
  <line x1="1250" y1="330" x2="1060" y2="420" class="conn"/>

</svg>

</body>
</html>
