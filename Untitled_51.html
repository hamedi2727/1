<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPC - REC | Operations Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* HEADER */
header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
}

/* LAYOUT */
.dashboard {
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  gap: 20px;
  padding: 25px;
}

/* BOXES */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

/* GRID FIX */
#pumpList {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

#lineList {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

#distList {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ITEM CARDS */
.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: 0.2s;
}
.item-card:hover {
  background: #111827;
}
.item-card h3 {
  margin: 0;
  font-size: 16px;
  color: #e5e7eb;
}

/* SVG WRAPPER */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container {
  transform-origin: center center;
  cursor: grab;
}
.svg-container:active {
  cursor: grabbing;
}

/* PDF TABLE */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-table th {
  background: #020617;
  font-weight: 700;
}
.pdf-table td {
  background: #020617;
}
.pdf-icon {
  color: #f97316;
  font-size: 18px;
}

/* MINIMAP */
.minimap {
  position:absolute;
  right:10px;
  bottom:10px;
  width:140px;
  height:90px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  overflow:hidden;
  opacity:0.85;
}
.minimap svg {
  width:100%;
  height:100%;
}
.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}

/* ANIMATION */
@keyframes fadeSlide {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.datetime-bar {
  background: #0f172a;
  border-bottom: 1px solid #1f2937;
  padding: 8px 25px;
  font-size: 15px;
  color: #e5e7eb;
  text-align: left;
  direction: ltr;
}
</style>
</head>

<body>

<header>
  <div class="title">CPC - REC | Operations Dashboard</div>
  <img src="qq.png" class="header-logo" height="73" width="98">
</header>

<div class="datetime-bar">
  <span id="dateTime"></span>
</div>

<div class="dashboard">

  <!-- RIGHT COLUMN -->
  <div>

    <div class="box" style="animation-delay:0.3s">
      <h2>Concrete Pump</h2>
      <div id="pumpList"></div>
    </div>

    <div class="box" style="animation-delay:0.4s">
      <h2>Line</h2>
      <div id="lineList"></div>
    </div>

    <div class="box" style="animation-delay:0.5s">
      <h2>Placing Boom</h2>
      <div id="distList"></div>
    </div>

  </div>

  <!-- CENTER COLUMN -->
  <div class="box" style="animation-delay:0.1s">
    <h2>المخطط الهندسي</h2>

    <h3 style="font-size:14px; margin:10px 0 8px;">Legend – وضع تشغيل الخطوط</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; font-size:12px;">
      <div class="legend-item">
        <span style="width:14px; height:4px; background:#22c55e; display:inline-block;"></span>
        <span>ACTIVE</span>
      </div>
      <div class="legend-item">
        <span style="width:14px; height:4px; background:#ef4444; display:inline-block;"></span>
        <span>Ready</span>
      </div>
      <div class="legend-item">
        <span style="width:14px; height:4px; background:#6b7280; display:inline-block;"></span>
        <span>Idle</span>
      </div>
    </div>

    <div class="svg-wrapper" id="svgWrapper" style="margin-top:10px; height:320px; position:relative;">
      <div class="svg-container" id="svgContainer">

        <!-- SVG CONTENT (unchanged) -->
        <!-- … نفس الـ SVG الذي أرسلته سابقًا بالكامل … -->

      </div>

      <!-- MINIMAP -->
      <div class="minimap">
        <!-- … نفس الـ Minimap الذي أرسلته سابقًا بالكامل … -->
      </div>

    </div>
  </div>

  <!-- LEFT COLUMN -->
  <div class="box" id="detailsBox" style="animation-delay:0.2s">
    <h2 id="detailName">اختر عنصرًا</h2>

    <div id="detailInfo">
      <p>—</p>
    </div>

    <h3 style="margin-top:20px">أرشيف ملفات PDF</h3>
    <table class="pdf-table" id="pdfTable">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>الملف</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="2">— لا توجد ملفات —</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
/* =======================
   DATA + CONNECTIONS
======================= */

const pumps = [
  { id: "P1", name: "P1-8800126" },
  { id: "P2", name: "P2-8800121" },
  { id: "P3", name: "P3-8800121" },
  { id: "P4", name: "P4-8800127" }
];

const lines = [
  { id: "L1", name: "01", mode: "ACTIVE" },
  { id: "L2", name: "02", mode: "STANDBY" },
  { id: "L3", name: "03", mode: "Idle" },
  { id: "L4", name: "04", mode: "Ready" },
  { id: "L5", name: "05", mode: "ACTIVE" },
  { id: "L6", name: "06", mode: "STANDBY" }
];

const distributors = [
  { id: "D1", name: "320043" },
  { id: "D2", name: "320050" },
  { id: "D3", name: "320051" },
  { id: "D4", name: "320049" },
  { id: "D5", name: "320048" }
];

const pumpToLines = {
  P1: ["L1"],
  P2: ["L3"],
  P3: ["L4"],
  P4: ["L5"]
};

const lineToDist = {
  L1: null,
  L2: "D1",
  L3: "D2",
  L4: "D3",
  L5: "D4",
  L6: "D5"
};

/* =======================
   RENDER LISTS
======================= */

function renderLists() {
  const pumpList = document.getElementById("pumpList");
  const lineList = document.getElementById("lineList");
  const distList = document.getElementById("distList");

  pumps.forEach(p => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${p.name}</h3>`;
    card.onclick = () => showDetails(p.id, "pump");
    pumpList.appendChild(card);
  });

  lines.forEach(l => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${l.name} – ${l.mode}</h3>`;
    card.onclick = () => showDetails(l.id, "line");
    lineList.appendChild(card);
  });

  distributors.forEach(d => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${d.name}</h3>`;
    card.onclick = () => showDetails(d.id, "dist");
    distList.appendChild(card);
  });
}

/* =======================
   HIGHLIGHT + DETAILS
======================= */

function resetHighlight() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.style.opacity = 0.25;
      el.setAttribute("stroke-width", 6);
    }
  });

  distributors.forEach(d => {
    const el = document.getElementById(d.id);
    if (el) el.style.opacity = 0.5;
  });

  pumps.forEach(p => {
    const el = document.getElementById(p.id);
    if (el) el.style.opacity = 1;
  });
}

function highlightElement(id, type) {
  const el = document.getElementById(id);
  if (!el) return;

  el.style.opacity = 1;

  if (type === "line") el.setAttribute("stroke-width", 7.5);
}

function showDetails(id, type) {
  resetHighlight();
  highlightElement(id, type);

  if (type === "pump") {
    (pumpToLines[id] || []).forEach(l => {
      highlightElement(l, "line");
      const dist = lineToDist[l];
      if (dist) highlightElement(dist, "dist");
    });
  }

  if (type === "line") {
    const dist = lineToDist[id];
    if (dist) highlightElement(dist, "dist");
  }

  if (type === "dist") {
    Object.entries(lineToDist).forEach(([lid, did]) => {
      if (did === id) highlightElement(lid, "line");
    });
  }
}

/* =======================
   ZOOM + PAN
======================= */

let currentScale = 1;
let currentTranslate = { x: 0, y: 0 };
let isPanning = false;
let startPan = { x: 0, y: 0 };

const svgContainer = document.getElementById("svgContainer");
const svgWrapper = document.getElementById("svgWrapper");

function updateTransform() {
  svgContainer.style.transform =
    `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentScale})`;
}

svgWrapper.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.1 : -0.1;
  currentScale = Math.min(2.5, Math.max(0.7, currentScale + delta));
  updateTransform();
});

svgWrapper.addEventListener("mousedown", (e) => {
  isPanning = true;
  startPan = { x: e.clientX - currentTranslate.x, y: e.clientY - currentTranslate.y };
});

window.addEventListener("mousemove", (e) => {
  if (!isPanning) return;
  currentTranslate.x = e.clientX - startPan.x;
  currentTranslate.y = e.clientY - startPan.y;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isPanning = false;
});

/* =======================
   INIT
======================= */

renderLists();
updateTransform();

function updateDateTime() {
  const now = new Date();
  document.getElementById("dateTime").textContent =
    now.toLocaleString("en-GB", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}

setInterval(updateDateTime, 1000);
updateDateTime();
</script>

</body>
</html>
