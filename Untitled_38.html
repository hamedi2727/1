<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPCEC – Pump | Line Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}
header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
}
.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  padding: 25px;
}
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container {
  transform-origin: center center;
  cursor: grab;
}
.svg-container:active {
  cursor: grabbing;
}
.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.item-card:hover {
  background: #111827;
}
.item-card h3 {
  margin: 0;
  font-size: 16px;
  color: #e5e7eb;
}
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-table th {
  background: #020617;
  font-weight: 700;
}
.pdf-table td {
  background: #020617;
}
.pdf-icon {
  color: #f97316;
  font-size: 18px;
}
.minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 140px;
  height: 90px;
  border-radius: 8px;
  border: 1px solid #1f2937;
  background: #020617;
  overflow: hidden;
  opacity: 0.85;
}
.minimap svg {
  width: 100%;
  height: 100%;
}
.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}
.legend-box {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(2, 6, 23, 0.65);
  border: 1px solid #1f2937;
  border-radius: 10px;
  backdrop-filter: blur(6px);
  width: fit-content;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #e5e7eb;
}
.legend-color {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid #1f2937;
}
.glow-line {
  filter: url(#glowFilter);
}
@keyframes fadeSlide {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>

<header>
  <div class="title">CPCEC – Pump | Line Dashboard</div>
</header>

<div class="dashboard">

  <div class="box" id="detailsBox" style="animation-delay:0.2s">
    <h2 id="detailName">اختر عنصرًا</h2>
    <div id="detailInfo"><p>—</p></div>

    <h3 style="margin-top:20px">أرشيف ملفات PDF</h3>
    <table class="pdf-table" id="pdfTable">
      <thead>
        <tr><th>التاريخ</th><th>الملف</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="2">— لا توجد ملفات —</td></tr>
      </tbody>
    </table>
  </div>

  <div class="box" style="animation-delay:0.3s">
    <h2>Concrete Pump</h2>
    <div id="pumpList"></div>
  </div>

  <div class="box" style="animation-delay:0.4s">
    <h2>Line</h2>
    <div id="lineList"></div>
  </div>

  <div class="box" style="animation-delay:0.5s">
    <h2>Placing Boom</h2>
    <div id="distList"></div>
  </div>

</div>

<div class="box" style="margin:25px; animation-delay:0.1s">
  <h2>المخطط الهندسي</h2>

  <button id="resetViewBtn" style="
    padding: 8px 14px;
    background:#0ea5e9;
    border:none;
    border-radius:8px;
    color:white;
    font-size:14px;
    cursor:pointer;
    margin-bottom:12px;
  ">
    إعادة التعيين
  </button>

  <div style="display:flex; gap:10px; margin-bottom:12px;">
    <button id="zoomInBtn" style="
      padding:8px 14px;
      background:#22c55e;
      border:none;
      border-radius:8px;
      color:white;
      font-size:14px;
      cursor:pointer;
    ">تكبير +</button>

    <button id="zoomOutBtn" style="
      padding:8px 14px;
      background:#ef4444;
      border:none;
      border-radius:8px;
      color:white;
      font-size:14px;
      cursor:pointer;
    ">تصغير –</button>
  </div>

  <input id="searchBox" type="text" placeholder="ابحث عن Pump أو Line أو Distributor..."
  style="
    width: 260px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #1f2937;
    background: #0f172a;
    color: #e5e7eb;
    margin-bottom: 12px;
    font-size: 14px;
  ">

  <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">

    <button class="filterBtn" data-mode="ALL" style="
      padding:8px 14px; background:#0ea5e9; border:none; border-radius:8px;
      color:white; font-size:14px; cursor:pointer;">
      الكل
    </button>

    <button class="filterBtn" data-mode="ACTIVE" style="
      padding:8px 14px; background:#22c55e; border:none; border-radius:8px;
      color:white; font-size:14px; cursor:pointer;">
      ACTIVE
    </button>

    <button class="filterBtn" data-mode="STANDBY" style="
      padding:8px 14px; background:#eab308; border:none; border-radius:8px;
      color:white; font-size:14px; cursor:pointer;">
      STANDBY
    </button>

    <button class="filterBtn" data-mode="Idle" style="
      padding:8px 14px; background:#6b7280; border:none; border-radius:8px;
      color:white; font-size:14px; cursor:pointer;">
      Idle
    </button>

    <button class="filterBtn" data-mode="Ready" style="
      padding:8px 14px; background:#ef4444; border:none; border-radius:8px;
      color:white; font-size:14px; cursor:pointer;">
      Ready
    </button>

  </div>

  <div class="legend-box">
    <div class="legend-item">
      <div class="legend-color" style="background:#22c55e"></div>
      <span>ACTIVE</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#eab308"></div>
      <span>STANDBY</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#6b7280"></div>
      <span>Idle</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#ef4444"></div>
      <span>Ready</span>
    </div>
  </div>

  <div class="svg-wrapper" id="svgWrapper" style="margin-top:10px; height:360px; position:relative;">
    <div class="svg-container" id="svgContainer" style="width:100%; height:100%; transform:scale(1) translate(0px,0px);">

      <svg id="mainSvg" width="100%" height="100%" viewBox="0 0 800 350">

        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
          </pattern>

          <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="innerShadow">
            <feOffset dx="0" dy="0"/>
            <feGaussianBlur stdDeviation="3" result="offset-blur"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
            <feFlood flood-color="black" flood-opacity="0.4"/>
            <feComposite operator="in" in="flood" in2="inverse"/>
            <feComposite operator="over" in="inverse" in2="SourceGraphic"/>
          </filter>

          <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
            <path d="M0,0 L0,6 L6,3 z" fill="currentColor"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" opacity="0.25"/>

        <g id="P1" onclick="showDetails('P1','pump')" style="cursor:pointer">
          <rect x="50" y="300" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
          <text x="90" y="325" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P1</text>
        </g>

        <g id="P2" onclick="showDetails('P2','pump')" style="cursor:pointer">
          <rect x="200" y="300" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
          <text x="240" y="325" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P2</text>
        </g>

        <g id="P3" onclick="showDetails('P3','pump')" style="cursor:pointer">
          <rect x="350" y="300" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
          <text x="390" y="325" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P3</text>
        </g>

        <g id="P4" onclick="showDetails('P4','pump')" style="cursor:pointer">
          <rect x="500" y="300" width="80" height="40" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" rx="8"/>
          <text x="540" y="325" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">P4</text>
        </g>

        <style>
          path { stroke-linecap: round; stroke-linejoin: round; }
        </style>

        <g id="G_L1" onclick="showDetails('L1','line')" style="cursor:pointer">
          <path id="L1" d="M90 300 L90 160 L150 130 L150 90"
                stroke-width="6" fill="none" color="#22c55e" marker-end="url(#arrowHead)"/>
        </g>

        <g id="G_L2" onclick="showDetails('L2','line')" style="cursor:pointer">
          <path id="L2" d="M240 300 L240 130 L300 130 L300 90"
                stroke-width="6" fill="none" color="#eab308" marker-end="url(#arrowHead)"/>
        </g>

        <g id="G_L3" onclick="showDetails('L3','line')" style="cursor:pointer">
          <path id="L3" d="M390 300 L390 130 L450 130 L450 90"
                stroke-width="6" fill="none" color="#6b7280" marker-end="url(#arrowHead)"/>
        </g>

        <g id="G_L4" onclick="showDetails('L4','line')" style="cursor:pointer">
          <path id="L4" d="M540 300 L540 130 L600 130 L600 90"
                stroke-width="6" fill="none" color="#ef4444" marker-end="url(#arrowHead)"/>
        </g>

        <g id="G_L5" onclick="showDetails('L5','line')" style="cursor:pointer">
          <path id="L5" d="M390 300 L390 150 L300 150 L300 90"
                stroke-width="6" fill="none" color="#22c55e" marker-end="url(#arrowHead)"/>
        </g>

        <g id="G_L6" onclick="showDetails('L6','line')" style="cursor:pointer">
          <path id="L6" d="M540 300 L540 150 L450 150 L450 90"
                stroke-width="6" fill="none" color="#eab308" marker-end="url(#arrowHead)"/>
        </g>

        <g id="D1" onclick="showDetails('D1','dist')" style="cursor:pointer">
          <circle cx="150" cy="70" r="30" fill="#f97316" filter="url(#innerShadow)"/>
          <text x="150" y="75" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">320043</text>
        </g>

        <g id="D2" onclick="showDetails('D2','dist')" style="cursor:pointer">
          <circle cx="300" cy="70" r="30" fill="#f97316" filter="url(#innerShadow)"/>
          <text x="300" y="75" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">320048</text>
        </g>

        <g id="D3" onclick="showDetails('D3','dist')" style="cursor:pointer">
          <circle cx="450" cy="70" r="30" fill="#f97316" filter="url(#innerShadow)"/>
          <text x="450" y="75" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">320049</text>
        </g>

        <g id="D4" onclick="showDetails('D4','dist')" style="cursor:pointer">
          <circle cx="600" cy="70" r="30" fill="#f97316" filter="url(#innerShadow)"/>
          <text x="600" y="75" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">320050</text>
        </g>

        <g id="D5" onclick="showDetails('D5','dist')" style="cursor:pointer">
          <circle cx="750" cy="70" r="30" fill="#f97316" filter="url(#innerShadow)"/>
          <text x="750" y="75" fill="#e5e7eb" font-size="16" font-weight="600" text-anchor="middle">320051</text>
        </g>

      </svg>
    </div>

    <div class="minimap">
      <svg viewBox="0 0 800 350">

        <rect x="50"  y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
        <rect x="200" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
        <rect x="350" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>
        <rect x="500" y="300" width="80" height="40" fill="#0ea5e9" rx="8" opacity="0.5"/>

        <path d="M90 300 L90 160 L150 130 L150 90" stroke="#22c55e" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M240 300 L240 130 L300 130 L300 90" stroke="#eab308" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M390 300 L390 130 L450 130 L450 90" stroke="#6b7280" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M540 300 L540 130 L600 130 L600 90" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.5"/>

        <path d="M390 300 L390 150 L300 150 L300 90" stroke="#22c55e" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M540 300 L540 150 L450 150 L450 90" stroke="#eab308" stroke-width="4" fill="none" opacity="0.5"/>

        <circle cx="150" cy="70" r="16" fill="#f97316" opacity="0.5"/>
        <circle cx="300" cy="70" r="16" fill="#f97316" opacity="0.5"/>
        <circle cx="450" cy="70" r="16" fill="#f97316" opacity="0.5"/>
        <circle cx="600" cy="70" r="16" fill="#f97316" opacity="0.5"/>
        <circle cx="750" cy="70" r="16" fill="#f97316" opacity="0.5"/>

        <rect id="minimapViewport" class="minimap-viewport" x="0" y="0" width="200" height="80"/>
      </svg>
    </div>

  </div>
</div>

<div class="box" style="margin:25px; animation-delay:0.2s" id="pdfReportSection">
  <h2>تقارير PDF لجميع العناصر</h2>
  <table class="pdf-table" style="margin-top:15px;">
    <thead>
      <tr>
        <th>العنصر</th>
        <th>التاريخ</th>
        <th>الملف</th>
      </tr>
    </thead>
    <tbody id="pdfReportTableBody">
    </tbody>
  </table>
</div>
<script>
const pumps = [
  { id: "P1", name: "P1-8800126" },
  { id: "P2", name: "P2-8800121" },
  { id: "P3", name: "P3-8800124" },
  { id: "P4", name: "P4-8800127" }
];

const lines = [
  { id: "L1", name: "01", mode: "ACTIVE" },
  { id: "L2", name: "02", mode: "STANDBY" },
  { id: "L3", name: "03", mode: "Idle" },
  { id: "L4", name: "04", mode: "Ready" },
  { id: "L5", name: "05", mode: "ACTIVE" },
  { id: "L6", name: "06", mode: "STANDBY" }
];

const distributors = [
  { id: "D1", name: "320043" },
  { id: "D2", name: "320048" },
  { id: "D3", name: "320049" },
  { id: "D4", name: "320050" },
  { id: "D5", name: "320051" }
];

const pumpToLines = {
  P1: ["L1", "L3"],
  P2: ["L2"],
  P3: ["L5"],
  P4: ["L4", "L6"]
};

const lineToDist = {
  L1: "D1",
  L2: "D2",
  L3: "D3",
  L4: "D4",
  L5: "D2",
  L6: "D3"
};

const pdfArchive = {
  P1: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P2: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P3: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  P4: [
    { date: "2026-01-22", url: "#" },
    { date: "2026-01-21", url: "#" }
  ],
  L1: [],
  L2: [],
  L3: [],
  L4: [],
  L5: [],
  L6: [],
  D1: [],
  D2: [],
  D3: [],
  D4: [],
  D5: []
};

function getLineColor(mode) {
  switch (mode) {
    case "ACTIVE": return "#22c55e";
    case "STANDBY": return "#eab308";
    case "Idle": return "#6b7280";
    case "Ready": return "#ef4444";
    default: return "#22c55e";
  }
}

function applyLineColors() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.setAttribute("stroke", getLineColor(l.mode));
      el.style.opacity = 1.25;
    }
  });
}

function renderLists() {
  const pumpList = document.getElementById("pumpList");
  const lineList = document.getElementById("lineList");
  const distList = document.getElementById("distList");

  pumps.forEach(p => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${p.name}</h3>`;
    card.onclick = () => showDetails(p.id, "pump");
    pumpList.appendChild(card);
  });

  lines.forEach(l => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${l.name} – ${l.mode}</h3>`;
    card.onclick = () => showDetails(l.id, "line");
    lineList.appendChild(card);
  });

  distributors.forEach(d => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${d.name}</h3>`;
    card.onclick = () => showDetails(d.id, "dist");
    distList.appendChild(card);
  });
}

function resetHighlight() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.style.opacity = 0.25;
      el.setAttribute("stroke-width", 6);
      el.classList.remove("glow-line");
    }
  });

  distributors.forEach(d => {
    const el = document.getElementById(d.id);
    if (el) el.style.opacity = 0.5;
  });

  pumps.forEach(p => {
    const el = document.getElementById(p.id);
    if (el) el.style.opacity = 1;
  });
}

function highlightElement(id, type) {
  if (type === "pump") {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = 1;
    gsap.fromTo(
      el,
      { scale: 1, y: -5 },
      { scale: 1.12, y: 0, duration: 0.35, ease: "power2.out" }
    );
  }

  if (type === "line") {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = 1;
    el.setAttribute("stroke-width", 9);
    el.classList.add("glow-line");
    gsap.fromTo(
      el,
      { opacity: 0.2 },
      { opacity: 1, duration: 0.4 }
    );
  }

  if (type === "dist") {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = 1;
    gsap.fromTo(
      el,
      { scale: 1, rotate: -4 },
      { scale: 1.10, rotate: 0, duration: 0.35, ease: "power2.out" }
    );
  }
}

function showDetails(id, type) {
  const detailTitle = document.getElementById("detailName");
  const detailInfo = document.getElementById("detailInfo");

  if (type === "pump") {
    const p = pumps.find(x => x.id === id);
    detailTitle.textContent = `المضخة ${p ? p.name : id}`;
  } else if (type === "line") {
    const l = lines.find(x => x.id === id);
    detailTitle.textContent = `الخط ${l ? l.name : id}`;
  } else {
    const d = distributors.find(x => x.id === id);
    detailTitle.textContent = `الموزع ${d ? d.name : id}`;
  }

  let extraInfo = "";
  if (type === "line") {
    const lineObj = lines.find(x => x.id === id);
    if (lineObj) {
      extraInfo = `<p>وضع التشغيل: ${lineObj.mode}</p>`;
    }
  }

  detailInfo.innerHTML = `
    <p>نوع العنصر: ${
      type === "pump" ? "مضخة" :
      type === "line" ? "خط" :
      "موزع"
    }</p>
    <p>المعرف: ${id}</p>
    ${extraInfo}
  `;

  const tableBody = document.querySelector("#pdfTable tbody");
  tableBody.innerHTML = "";

  const files = pdfArchive[id] || [];

  if (!files || files.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="2">— لا توجد ملفات PDF —</td></tr>`;
  } else {
    files.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${f.date}</td>
        <td><a href="${f.url}" target="_blank" class="pdf-icon">📄</a></td>
      `;
      tableBody.appendChild(tr);
    });
  }

  resetHighlight();

  if (type === "pump") {
    highlightElement(id, "pump");
    const relatedLines = pumpToLines[id] || [];
    relatedLines.forEach(lid => {
      highlightElement(lid, "line");
      const distId = lineToDist[lid];
      if (distId) highlightElement(distId, "dist");
    });
  }

  if (type === "line") {
    highlightElement(id, "line");
    const distId = lineToDist[id];
    if (distId) highlightElement(distId, "dist");
  }

  if (type === "dist") {
    highlightElement(id, "dist");
    Object.entries(lineToDist).forEach(([lid, did]) => {
      if (did === id) highlightElement(lid, "line");
    });
  }
}

let currentScale = 1;
let currentTranslate = { x: 0, y: 0 };
let isPanning = false;
let startPan = { x: 0, y: 0 };

const svgContainer = document.getElementById("svgContainer");
const svgWrapper = document.getElementById("svgWrapper");
const minimapViewport = document.getElementById("minimapViewport");

function updateTransform() {
  svgContainer.style.transform =
    `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentScale})`;
  updateMinimapViewport();
}

function updateMinimapViewport() {
  const viewW = 800 / currentScale;
  const viewH = 350 / currentScale;
  const scaleX = 800 / svgWrapper.clientWidth;
  const scaleY = 350 / svgWrapper.clientHeight;

  const offsetX = -currentTranslate.x * scaleX / currentScale;
  const offsetY = -currentTranslate.y * scaleY / currentScale;

  minimapViewport.setAttribute("width", viewW);
  minimapViewport.setAttribute("height", viewH);
  minimapViewport.setAttribute("x", offsetX);
  minimapViewport.setAttribute("y", offsetY);
}

svgWrapper.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.1 : -0.1;
  const newScale = Math.min(2.5, Math.max(0.7, currentScale + delta));
  currentScale = newScale;
  updateTransform();
});

svgWrapper.addEventListener("mousedown", (e) => {
  isPanning = true;
  startPan = { x: e.clientX - currentTranslate.x, y: e.clientY - currentTranslate.y };
});

window.addEventListener("mousemove", (e) => {
  if (!isPanning) return;
  currentTranslate.x = e.clientX - startPan.x;
  currentTranslate.y = e.clientY - startPan.y;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isPanning = false;
});

document.getElementById("resetViewBtn").addEventListener("click", () => {
  currentScale = 1;
  currentTranslate = { x: 0, y: 0 };
  updateTransform();
  gsap.fromTo(
    svgContainer,
    { opacity: 0.5 },
    { opacity: 1, duration: 0.3 }
  );
});

document.getElementById("zoomInBtn").addEventListener("click", () => {
  currentScale = Math.min(2.5, currentScale + 0.15);
  updateTransform();
  gsap.fromTo(
    svgContainer,
    { scale: currentScale - 0.1 },
    { scale: currentScale, duration: 0.25, transformOrigin: "center center" }
  );
});

document.getElementById("zoomOutBtn").addEventListener("click", () => {
  currentScale = Math.max(0.7, currentScale - 0.15);
  updateTransform();
  gsap.fromTo(
    svgContainer,
    { scale: currentScale + 0.1 },
    { scale: currentScale, duration: 0.25, transformOrigin: "center center" }
  );
});

document.getElementById("searchBox").addEventListener("input", function () {
  const q = this.value.trim().toLowerCase();
  if (q.length === 0) return;

  const pump = pumps.find(p => p.id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  if (pump) {
    showDetails(pump.id, "pump");
    return;
  }

  const line = lines.find(l => l.id.toLowerCase().includes(q) || l.name.toLowerCase().includes(q));
  if (line) {
    showDetails(line.id, "line");
    return;
  }

  const dist = distributors.find(d => d.id.toLowerCase().includes(q) || d.name.toLowerCase().includes(q));
  if (dist) {
    showDetails(dist.id, "dist");
    return;
  }
});

document.querySelectorAll(".filterBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.getAttribute("data-mode");
    resetHighlight();

    lines.forEach(l => {
      const el = document.getElementById(l.id);
      if (!el) return;

      if (mode === "ALL") {
        el.style.opacity = 1;
        el.setAttribute("stroke-width", 6);
        return;
      }

      if (l.mode === mode) {
        el.style.opacity = 1;
        el.setAttribute("stroke-width", 7);
      } else {
        el.style.opacity = 0.1;
        el.setAttribute("stroke-width", 4);
      }
    });
  });
});

function renderPdfReport() {
  const tableBody = document.getElementById("pdfReportTableBody");
  if (!tableBody) return;
  tableBody.innerHTML = "";

  const allKeys = Object.keys(pdfArchive);
  allKeys.forEach(key => {
    const files = pdfArchive[key];
    if (!files || files.length === 0) return;

    files.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${key}</td>
        <td>${f.date}</td>
        <td><a href="${f.url}" target="_blank" class="pdf-icon">📄</a></td>
      `;
      tableBody.appendChild(tr);
    });
  });
}

renderLists();
applyLineColors();
resetHighlight();
updateTransform();
renderPdfReport();
</script>

</body>
</html>
