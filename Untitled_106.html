<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPC – SCADA Cyber Dashboard</title>

<style>

/* ================================
   GLOBAL CYBER‑INDUSTRIAL THEME
================================ */

body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at center, #0b0f17 0%, #05070c 100%);
  font-family: "Segoe UI", sans-serif;
  color: #e5e7eb;
  overflow: hidden;
}

/* Moving cyber grid */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 200%;
  height: 200%;
  background-image:
    linear-gradient(#1e293b 1px, transparent 1px),
    linear-gradient(90deg, #1e293b 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.08;
  animation: gridMove 18s linear infinite;
  pointer-events: none;
}

@keyframes gridMove {
  from { transform: translate(0,0); }
  to   { transform: translate(-200px, -200px); }
}

/* ================================
   HEADER
================================ */

.fixed-header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 62px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid #1e293b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 1000;
  box-shadow: 0 0 18px rgba(0, 150, 255, 0.25);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-logo {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 0 6px #38bdf8);
}

.title {
  font-size: 18px;
  font-weight: bold;
  color: #e0f2fe;
  text-shadow: 0 0 8px #0ea5e9;
}

/* ================================
   LANGUAGE SWITCH
================================ */

.lang-switch button {
  padding: 6px 14px;
  margin-left: 6px;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 6px;
  color: #e2e8f0;
  cursor: pointer;
  transition: 0.25s;
}

.lang-switch button.active {
  background: #1e3a8a;
  border-color: #3b82f6;
  color: #fff;
  box-shadow: 0 0 10px #3b82f6;
}

.lang-switch button:hover {
  background: #1e293b;
}

/* ================================
   DATE & TIME BAR
================================ */

.datetime-bar {
  margin-top: 62px;
  height: 40px;
  background: rgba(15, 23, 42, 0.7);
  border-bottom: 1px solid #1e293b;
  display: flex;
  align-items: center;
  padding-right: 20px;
  font-size: 15px;
  color: #93c5fd;
  text-shadow: 0 0 6px #0ea5e9;
}

/* ================================
   DASHBOARD GRID
================================ */

.dashboard {
  margin-top: 20px;
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: 420px 260px;
  gap: 20px;
  height: calc(100vh - 120px);
}

.box {
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid #1e293b;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 0 12px rgba(0, 150, 255, 0.15);
  overflow: hidden;
}

.box h2 {
  margin: 0 0 10px 0;
  font-size: 17px;
  color: #93c5fd;
  text-shadow: 0 0 6px #0ea5e9;
}
/* ================================
   MAP BOX + SVG WRAPPER
================================ */

#mapBox {
  position: relative;
}

.svg-wrapper {
  width: 100%;
  height: 100%;
  overflow: auto;
  border: 1px solid #1e293b;
  border-radius: 8px;
  background: rgba(10, 15, 25, 0.6);
  box-shadow: inset 0 0 12px rgba(0, 150, 255, 0.15);
  cursor: grab;
}

.svg-wrapper:active {
  cursor: grabbing;
}

.svg-container {
  width: 1400px;
  height: 650px;
  transform-origin: top left;
  transition: transform 0.15s ease-out;
}

/* ================================
   SVG ELEMENTS — CYBER STYLE
================================ */

svg text {
  font-family: "Segoe UI", sans-serif;
  user-select: none;
}

svg rect {
  transition: 0.25s;
}

svg rect:hover {
  filter: drop-shadow(0 0 10px #38bdf8);
  transform: scale(1.04);
}

/* ================================
   FLOW PATHS (ANIMATED)
================================ */

.flow-path {
  stroke-dasharray: 14;
  animation: flowMove 1.2s linear infinite;
  opacity: 0.85;
}

@keyframes flowMove {
  from { stroke-dashoffset: 0; }
  to   { stroke-dashoffset: -28; }
}

/* ================================
   SPARK EFFECT
================================ */

.spark {
  filter: url(#sparkFilter);
  opacity: 0.55;
  animation: sparkPulse 0.8s ease-in-out infinite alternate;
}

@keyframes sparkPulse {
  from { opacity: 0.25; }
  to   { opacity: 0.9; }
}

/* ================================
   HIGHLIGHT EFFECT
================================ */

.highlighted {
  filter: drop-shadow(0 0 12px #38bdf8) !important;
  transform: scale(1.06) !important;
}

/* ================================
   DETAILS PANEL
================================ */

#detailsBox p, #detailsBox a, #detailsBox td {
  color: #cbd5e1;
}

#detailsBox a:hover {
  color: #60a5fa;
}

/* ================================
   REPORTS BOX
================================ */

#reportsBox button:hover {
  background: #1e293b;
  box-shadow: 0 0 10px #3b82f6;
}

/* ================================
   END OF CSS
================================ */
</style>
</head>

      </a>

      <a id="btnSpecs" href="#" target="_blank"
         style="padding:8px 12px; background:#0f172a; border:1px solid #1e293b;
                border-radius:6px; color:#e5e7eb; text-decoration:none; font-size:13px;">
        المواصفات
      </a>

      <a id="btnInsurance" href="#" target="_blank"
         style="padding:8px 12px; background:#0f172a; border:1px solid #1e293b;
                border-radius:6px; color:#e5e7eb; text-decoration:none; font-size:13px;">
        التأمين
      </a>
    </div>

    <h3 style="margin-top:20px; font-size:15px;">أرشيف ملفات PDF</h3>

    <table id="pdfTable" style="width:100%; margin-top:10px; font-size:13px; border-collapse:collapse;">
      <thead>
        <tr style="background:#1e293b;">
          <th id="pdfDateHeader" style="padding:6px; border:1px solid #334155;">التاريخ</th>
          <th id="pdfFileHeader" style="padding:6px; border:1px solid #334155;">الملف</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 style="margin-top:20px; font-size:15px;">ملفات الصيانة</h3>

    <table id="maintenancePdfTable" style="width:100%; margin-top:10px; font-size:13px; border-collapse:collapse;">
      <thead>
        <tr style="background:#1e293b;">
          <th style="padding:6px; border:1px solid #334155;">التاريخ</th>
          <th style="padding:6px; border:1px solid #334155;">الملف</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div> <!-- detailsBox -->


  <!-- ============================
       BOTTOM LEFT — REPORT BUTTONS
  ============================ -->

  <div class="box" id="reportsBox" style="grid-column:1; grid-row:2;">
    <h2>التقارير</h2>

    <button onclick="openDailyReport()" style="
      padding:10px 15px; background:#0f172a; border:1px solid #1e293b;
      border-radius:6px; color:#e5e7eb; cursor:pointer; font-size:14px;">
      التقرير اليومي
    </button>

    <button onclick="openMonthlyReport()" style="
      padding:10px 15px; background:#0f172a; border:1px solid #1e293b;
      border-radius:6px; color:#e5e7eb; cursor:pointer; font-size:14px; margin-left:10px;">
      التقرير الشهري
    </button>
  </div>


  <!-- ============================
       BOTTOM RIGHT — EXTRA INFO
  ============================ -->

  <div class="box" id="emptyBox" style="grid-column:2; grid-row:2;">
    <h2>معلومات إضافية</h2>
    <p style="font-size:14px; color:#9ca3af;">—</p>
  </div>

</div> <!-- END DASHBOARD -->
<script>
/* =======================
   DATA — LINES STATUS
======================= */

const lines = [
  { id: "L1", mode: "Ready" },
  { id: "L2", mode: "ACTIVE" },
  { id: "L3", mode: "Idle" },
  { id: "L4", mode: "ACTIVE" },
  { id: "L5", mode: "ACTIVE" },
  { id: "L6", mode: "Idle" }
];

/* =======================
   DATA — PUMPS
======================= */

const pumps = [
  { id: "SP1", name: "8800126", mode: "Ready" },
  { id: "SP2", name: "8800121", mode: "ACTIVE" },
  { id: "SP3", name: "8800124", mode: "ACTIVE" },
  { id: "SP4", name: "8800127", mode: "ACTIVE" }
];

/* =======================
   DATA — DISTRIBUTORS
======================= */

const distributors = [
  { id: "Center core 1", name: "Slabs" },
  { id: "Wing C", name: "SPB# 320043" },
  { id: "Center core 2", name: "SPB# 320050" },
  { id: "Wing A", name: "SPB# 320051" },
  { id: "Wing B", name: "SPB# 320049" },
  { id: "Wing B 2", name: "SPB# 320048" }
];

/* =======================
   PDF ARCHIVE
======================= */

const pdfArchive = {
  SP1: { catalog: "#", specs: "#", insurance: "#", archive: [], maintenance: [] },
  SP2: { catalog: "#", specs: "#", insurance: "#", archive: [], maintenance: [] },
  SP3: { catalog: "#", specs: "#", insurance: "#", archive: [], maintenance: [] },
  SP4: { catalog: "#", specs: "#", insurance: "#", archive: [], maintenance: [] }
};

/* =======================
   TRANSLATIONS
======================= */

const translations = {
  ar: {
    mapTitle: "المخطط الهندسي",
    legendActive: "نشط",
    legendStandby: "جاهز",
    legendIdle: "خامل",
    type: "النوع",
    id: "المعرف",
    pumpLabel: "مضخة",
    lineLabel: "خط",
    distLabel: "موزع",
    mode: "الوضع"
  },
  en: {
    mapTitle: "Engineering Map",
    legendActive: "Active",
    legendStandby: "Standby",
    legendIdle: "Idle",
    type: "Type",
    id: "ID",
    pumpLabel: "Pump",
    lineLabel: "Line",
    distLabel: "Distributor",
    mode: "Mode"
  }
};

let currentLang = "ar";

/* =======================
   APPLY LANGUAGE
======================= */

function applyLanguage() {
  const t = translations[currentLang];

  document.getElementById("mapTitle").textContent = t.mapTitle;
  document.getElementById("legendActive").textContent = t.legendActive;
  document.getElementById("legendStandby").textContent = t.legendStandby;
  document.getElementById("legendIdle").textContent = t.legendIdle;

  document.getElementById("pdfDateHeader").textContent =
    currentLang === "ar" ? "التاريخ" : "Date";
  document.getElementById("pdfFileHeader").textContent =
    currentLang === "ar" ? "الملف" : "File";
}

/* =======================
   COLOR LINES BY MODE
======================= */

function applyLineColors() {
  lines.forEach(line => {
    const el = document.getElementById(line.id);
    if (!el) return;

    const rect = el.querySelector("rect");

    if (line.mode === "ACTIVE") {
      rect.setAttribute("fill", "#22c55e");
      rect.setAttribute("stroke", "#15803d");
    }
    else if (line.mode === "Ready") {
      rect.setAttribute("fill", "#eab308");
      rect.setAttribute("stroke", "#b45309");
    }
    else {
      rect.setAttribute("fill", "#6b7280");
      rect.setAttribute("stroke", "#4b5563");
    }
  });
}

/* =======================
   FLOW EFFECTS
======================= */

function applyFlowEffects() {
  const activeLines = ["L2", "L4", "L5"];

  activeLines.forEach(id => {
    const line = document.getElementById(id);
    if (!line) return;

    line.querySelector("rect").classList.add("flow-path");
  });
}

/* =======================
   LINK PATHS
======================= */

const pumpLinkPaths = {
  SP1: "link_SP1",
  SP2: "link_SP2",
  SP3: "link_SP3",
  SP4: "link_SP4"
};

/* =======================
   HIGHLIGHT ELEMENT
======================= */

function resetHighlight() {
  document.querySelectorAll(".highlighted").forEach(el => {
    el.classList.remove("highlighted");
    el.style.filter = "";
    el.style.transform = "";
  });
}

function highlightElement(id, type) {
  resetHighlight();

  const el = document.getElementById(id);
  if (!el) return;

  el.classList.add("highlighted");

  if (type === "pump") {
    const linkId = pumpLinkPaths[id];
    const link = document.getElementById(linkId);
    if (link) {
      link.style.filter = "drop-shadow(0 0 12px #38bdf8)";
      link.style.opacity = "1";
    }
  }
}

/* =======================
   SHOW DETAILS
======================= */

function showDetails(id, type) {
  resetHighlight();
  highlightElement(id, type);

  const t = translations[currentLang];
  const detailName = document.getElementById("detailName");
  const detailInfo = document.getElementById("detailInfo");

  let title = "";
  let info = "";

  if (type === "pump") {
    const pump = pumps.find(p => p.id === id);
    if (!pump) return;

    title = `${t.pumpLabel}: ${pump.id}`;
    info = `
      <p><strong>${t.id}:</strong> ${pump.name}</p>
      <p><strong>${t.mode}:</strong> ${pump.mode}</p>
    `;

    document.getElementById("btnCatalog").href = pdfArchive[id].catalog;
    document.getElementById("btnSpecs").href = pdfArchive[id].specs;
    document.getElementById("btnInsurance").href = pdfArchive[id].insurance;

    updatePdfTables(id);
  }

  else if (type === "line") {
    const line = lines.find(l => l.id === id);
    if (!line) return;

    title = `${t.lineLabel}: ${line.id}`;
    info = `<p><strong>${t.mode}:</strong> ${line.mode}</p>`;

    updatePdfTables(null);
  }

  else if (type === "dist") {
    const dist = distributors.find(d => d.id === id);
    if (!dist) return;

    title = `${t.distLabel}: ${dist.id}`;
    info = `<p><strong>${t.id}:</strong> ${dist.name}</p>`;

    updatePdfTables(null);
  }

  detailName.textContent = title;
  detailInfo.innerHTML = info;
}

/* =======================
   UPDATE PDF TABLES
======================= */

function updatePdfTables(pumpId) {
  const table = document.querySelector("#pdfTable tbody");
  const table2 = document.querySelector("#maintenancePdfTable tbody");

  table.innerHTML = "";
  table2.innerHTML = "";

  if (!pumpId) return;

  const archive = pdfArchive[pumpId].archive;
  const maintenance = pdfArchive[pumpId].maintenance;

  archive.forEach(item => {
    table.innerHTML += `
      <tr>
        <td style="padding:6px; border:1px solid #334155;">${item.date}</td>
        <td style="padding:6px; border:1px solid #334155;">
          <a href="${item.url}" target="_blank" style="color:#38bdf8;">${item.name}</a>
        </td>
      </tr>`;
  });

  maintenance.forEach(item => {
    table2.innerHTML += `
      <tr>
        <td style="padding:6px; border:1px solid #334155;">${item.date}</td>
        <td style="padding:6px; border:1px solid #334155;">
          <a href="${item.url}" target="_blank" style="color:#38bdf8;">${item.name}</a>
        </td>
      </tr>`;
  });
}

/* =======================
   REPORT BUTTONS
======================= */

function openDailyReport() {
  window.open("daily_report.pdf", "_blank");
}

function openMonthlyReport() {
  window.open("monthly_report.pdf", "_blank");
}

/* =======================
   SVG DRAGGING
======================= */

let isDragging = false;
let startX, startY;
let scrollLeft, scrollTop;

const svgWrapper = document.getElementById("svgWrapper");
const svgContainer = document.getElementById("svgContainer");

svgWrapper.addEventListener("mousedown", (e) => {
  isDragging = true;
  startX = e.pageX - svgWrapper.offsetLeft;
  startY = e.pageY - svgWrapper.offsetTop;
  scrollLeft = svgWrapper.scrollLeft;
  scrollTop = svgWrapper.scrollTop;
});

svgWrapper.addEventListener("mouseleave", () => {
  isDragging = false;
});

svgWrapper.addEventListener("mouseup", () => {
  isDragging = false;
});

svgWrapper.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  e.preventDefault();

  const x = e.pageX - svgWrapper.offsetLeft;
  const y = e.pageY - svgWrapper.offsetTop;

  const walkX = (x - startX);
  const walkY = (y - startY);

  svgWrapper.scrollLeft = scrollLeft - walkX;
  svgWrapper.scrollTop = scrollTop - walkY;
});

/* =======================
   SVG ZOOM
======================= */

let zoomLevel = 1;

svgWrapper.addEventListener("wheel", (e) => {
  e.preventDefault();

  if (e.deltaY < 0) zoomLevel += 0.05;
  else zoomLevel -= 0.05;

  zoomLevel = Math.min(Math.max(zoomLevel, 0.5), 2);

  svgContainer.style.transform = `scale(${zoomLevel})`;
});

/* =======================
   UPDATE DATE & TIME
======================= */

function updateDateTime() {
  const now = new Date();
  const formatted = now.toLocaleString("ar-SA", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

  document.getElementById("dateTime").textContent = formatted;
}

setInterval(updateDateTime, 1000);
updateDateTime();

/* =======================
   LANGUAGE SWITCH
======================= */

document.getElementById("langAr").onclick = () => {
  currentLang = "ar";
  document.getElementById("langAr").classList.add("active");
  document.getElementById("langEn").classList.remove("active");
  applyLanguage();
};

document.getElementById("langEn").onclick = () => {
  currentLang = "en";
  document.getElementById("langEn").classList.add("active");
  document.getElementById("langAr").classList.remove("active");
  applyLanguage();
};

/* =======================
   INITIALIZATION
======================= */

applyLanguage();
applyLineColors();
applyFlowEffects();

</script>

</body>
</html>
