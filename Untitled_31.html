<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPCEC – Pump - Line Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* HEADER */
header {
  background: #020617;
  padding: 15px 25px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .title {
  font-size: 20px;
  font-weight: 700;
  color: #e5e7eb;
}

/* LAYOUT */
.dashboard {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 20px;
  padding: 25px;
}

/* BOXES */
.box {
  background: #020617;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #1f2937;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlide 0.6s ease forwards;
}
.box h2 {
  margin: 0 0 15px;
  font-size: 18px;
  color: #e5e7eb;
}

/* SVG WRAPPER (ZOOM + PAN) */
.svg-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
}
.svg-container {
  transform-origin: center center;
  cursor: grab;
}
.svg-container:active {
  cursor: grabbing;
}

/* LIST ITEMS */
.item-card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.item-card:hover {
  background: #111827;
}
.item-card h3 {
  margin: 0;
  font-size: 16px;
  color: #e5e7eb;
}

/* PDF TABLE */
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}
.pdf-table th, .pdf-table td {
  padding: 8px;
  border: 1px solid #1f2937;
  text-align: center;
}
.pdf-table th {
  background: #020617;
  font-weight: 700;
}
.pdf-table td {
  background: #020617;
}
.pdf-icon {
  color: #f97316;
  font-size: 18px;
}

/* LEGEND */
.legend-item {
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border-radius:6px;
  background:#020617;
  border:1px solid #1f2937;
}

/* MINIMAP */
.minimap {
  position:absolute;
  right:10px;
  bottom:10px;
  width:140px;
  height:90px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  overflow:hidden;
  opacity:0.85;
}
.minimap svg {
  width:100%;
  height:100%;
}
.minimap-viewport {
  fill: none;
  stroke: #f97316;
  stroke-width: 1.5;
}

/* GLOW FILTER */
.glow-line {
  filter: url(#glowFilter);
}

/* ANIMATION */
@keyframes fadeSlide {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<header>
  <div class="title">CPCEC – Pump - Line Dashboard</div>
</header>

<div class="dashboard">

<!-- SVG COLUMN -->
<div class="box" style="animation-delay:0.1s">
  <h2>المخطط الهندسي</h2>

  <!-- LEGEND -->
  <h3 style="font-size:14px; margin:10px 0 8px;">Legend – وضع تشغيل الخطوط</h3>
  <div style="display:flex; gap:8px; flex-wrap:wrap; font-size:12px;">
    <div class="legend-item">
      <span style="width:14px; height:4px; background:#22c55e; display:inline-block;"></span>

    <!-- MINIMAP -->
    <div class="minimap">

<script>
/* =======================
   DATA
======================= */

const pumps = [
  { id: "P1", name: "P1-8800126" },
  { id: "P2", name: "P2-8800121" },
  { id: "P3", name: "P3-8800124" },
  { id: "P4", name: "P4-8800127" }
];

const lines = [
  { id: "L1", name: "01", mode: "ACTIVE" },
  { id: "L2", name: "02", mode: "STANDBY" },
  { id: "L3", name: "03", mode: "OFF" },
  { id: "L4", name: "04", mode: "MAINTENANCE" },
  { id: "L5", name: "05", mode: "ACTIVE" },
  { id: "L6", name: "06", mode: "STANDBY" }
];

const distributors = [
  { id: "D1", name: "320043" },
  { id: "D2", name: "320048" },
  { id: "D3", name: "320049" },
  { id: "D4", name: "320050" },
  { id: "D5", name: "320051" }
];

/* =======================
   CONNECTIONS
======================= */

const pumpToLines = {
  P1: ["L1", "L3"],
  P2: ["L2"],
  P3: ["L5"],
  P4: ["L4", "L6"]
};

const lineToDist = {
  L1: "D1",
  L2: "D2",
  L3: "D3",
  L4: "D4",
  L5: "D2",
  L6: "D3"
};

/* =======================
   PDF ARCHIVE
======================= */

const pdfArchive = {
  P1: [
    { date: "2026-01-18", url: "#" },
    { date: "2026-01-17", url: "#" }
  ],
  P2: [
    { date: "2026-01-18", url: "#" },
    { date: "2026-01-17", url: "#" }
  ],
  P3: [
    { date: "2026-01-18", url: "#" },
    { date: "2026-01-17", url: "#" }
  ],
  P4: [
    { date: "2026-01-18", url: "#" },
    { date: "2026-01-17", url: "#" }
  ],
  L1: [{ date: "2026-01-18", url: "#" }],
  L2: [{ date: "2026-01-18", url: "#" }],
  L3: [{ date: "2026-01-18", url: "#" }],
  L4: [{ date: "2026-01-18", url: "#" }],
  L5: [{ date: "2026-01-18", url: "#" }],
  L6: [{ date: "2026-01-18", url: "#" }],
  D1: [],
  D2: [],
  D3: [],
  D4: [],
  D5: []
};

/* =======================
   COLOR BY MODE
======================= */

function getLineColor(mode) {
  switch (mode) {
    case "ACTIVE": return "#22c55e";
    case "STANDBY": return "#eab308";
    case "OFF": return "#6b7280";
    case "MAINTENANCE": return "#ef4444";
    default: return "#22c55e";
  }
}

function applyLineColors() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.setAttribute("stroke", getLineColor(l.mode));
      el.style.opacity = 0.25;
    }
  });

  distributors.forEach(d => {
    const el = document.getElementById(d.id);
    if (el) el.style.opacity = 0.5;
  });

  pumps.forEach(p => {
    const el = document.getElementById(p.id);
    if (el) el.style.opacity = 0.9;
  });
}

/* =======================
   RENDER LISTS
======================= */

function renderLists() {
  const pumpList = document.getElementById("pumpList");
  const lineList = document.getElementById("lineList");
  const distList = document.getElementById("distList");

  pumps.forEach(p => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${p.name}</h3>`;
    card.onclick = () => showDetails(p.id, "pump");
    pumpList.appendChild(card);
  });

  lines.forEach(l => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${l.name} – ${l.mode}</h3>`;
    card.onclick = () => showDetails(l.id, "line");
    lineList.appendChild(card);
  });

  distributors.forEach(d => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<h3>${d.name}</h3>`;
    card.onclick = () => showDetails(d.id, "dist");
    distList.appendChild(card);
  });
}

/* =======================
   HIGHLIGHT + GLOW + GSAP
======================= */

function resetHighlight() {
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    if (el) {
      el.style.opacity = 0.25;
      el.setAttribute("stroke-width", 6);
      el.classList.remove("glow-line");
    }
    const group = document.getElementById("G_" + l.id);
    if (group) {
      gsap.to(group, { scale: 1, duration: 0.2 });
    }
  });

  distributors.forEach(d => {
    const el = document.getElementById(d.id);
    if (el) {
      el.style.opacity = 0.5;
      const c = el.querySelector("circle");
      if (c) c.setAttribute("fill", "#f97316");
      gsap.to(el, { scale: 1, duration: 0.2 });
    }
  });

  pumps.forEach(p => {
    const el = document.getElementById(p.id);
    if (el) {
      const r = el.querySelector("rect");
      if (r) r.setAttribute("fill", "#0ea5e9");
      el.style.opacity = 0.9;
      gsap.to(el, { scale: 1, duration: 0.2 });
    }
  });
}

function highlightElement(id, type) {
  if (type === "pump") {
    const el = document.getElementById(id);
    const r = el.querySelector("rect");
    r.setAttribute("fill", "#0284c7");
    el.style.opacity = 1;
    gsap.to(el, { scale: 1.06, duration: 0.25 });
  }

  if (type === "line") {
    const el = document.getElementById(id);
    const group = document.getElementById("G_" + id);
    el.style.opacity = 1;
    el.setAttribute("stroke-width", 7.5);
    el.classList.add("glow-line");
    gsap.to(group, { scale: 1.03, duration: 0.25 });
  }

  if (type === "dist") {
    const el = document.getElementById(id);
    el.style.opacity = 1;
    const c = el.querySelector("circle");
    c.setAttribute("fill", "#fb923c");
    gsap.to(el, { scale: 1.08, duration: 0.25 });
  }
}

/* =======================
   HOVER EFFECTS
======================= */

function attachHoverEffects() {
  lines.forEach(l => {
    const group = document.getElementById("G_" + l.id);
    const path = document.getElementById(l.id);
    if (!group || !path) return;

    group.addEventListener("mouseenter", () => {
      gsap.to(path, { strokeWidth: 8, duration: 0.2 });
      gsap.to(group, { scale: 1.03, duration: 0.2 });
    });

    group.addEventListener("mouseleave", () => {
      gsap.to(path, { strokeWidth: 6, duration: 0.2 });
      gsap.to(group, { scale: 1, duration: 0.2 });
    });
  });
}

/* =======================
   SHOW DETAILS
======================= */

function showDetails(id, type) {

  document.getElementById("detailName").textContent =
    type === "pump" ? `المضخة ${pumps.find(x => x.id === id).name}` :
    type === "line" ? `الخط ${lines.find(x => x.id === id).name}` :
    `الموزع ${distributors.find(x => x.id === id).name}`;

  let extraInfo = "";
  if (type === "line") {
    const lineObj = lines.find(x => x.id === id);
    extraInfo = `<p>وضع التشغيل: ${lineObj.mode}</p>`;
  }

  document.getElementById("detailInfo").innerHTML = `
    <p>نوع العنصر: ${
      type === "pump" ? "مضخة" :
      type === "line" ? "خط" :
      "موزع"
    }</p>
    <p>المعرف: ${id}</p>
    ${extraInfo}
  `;

  const tableBody = document.querySelector("#pdfTable tbody");
  tableBody.innerHTML = "";

  const files = pdfArchive[id] || [];

  if (!files || files.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="2">— لا توجد ملفات PDF —</td></tr>`;
  } else {
    files.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${f.date}</td>
        <td><a href="${f.url}" target="_blank" class="pdf-icon">📄</a></td>
      `;
      tableBody.appendChild(tr);
    });
  }

  resetHighlight();

  if (type === "pump") {
    highlightElement(id, "pump");

    const relatedLines = pumpToLines[id] || [];
    relatedLines.forEach(lid => {
      highlightElement(lid, "line");
      const distId = lineToDist[lid];
      if (distId) highlightElement(distId, "dist");
    });
  }

  if (type === "line") {
    highlightElement(id, "line");
    const distId = lineToDist[id];
    if (distId) highlightElement(distId, "dist");
  }

  if (type === "dist") {
    highlightElement(id, "dist");
    Object.entries(lineToDist).forEach(([lid, did]) => {
      if (did === id) {
        highlightElement(lid, "line");
      }
    });
  }
}

/* =======================
   ZOOM + PAN + MINIMAP
======================= */

let currentScale = 1;
let currentTranslate = { x: 0, y: 0 };
let isPanning = false;
let startPan = { x: 0, y: 0 };

const svgContainer = document.getElementById("svgContainer");
const svgWrapper = document.getElementById("svgWrapper");
const minimapViewport = document.getElementById("minimapViewport");

function updateTransform() {
  svgContainer.style.transform =
    `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentScale})`;
  updateMinimapViewport();
}

function updateMinimapViewport() {
  const viewW = 800 / currentScale;
  const viewH = 260 / currentScale;
  const offsetX = -currentTranslate.x * (800 / svgWrapper.clientWidth) / currentScale;
  const offsetY = -currentTranslate.y * (260 / svgWrapper.clientHeight) / currentScale;

  minimapViewport.setAttribute("width", viewW);
  minimapViewport.setAttribute("height", viewH);
  minimapViewport.setAttribute("x", offsetX);
  minimapViewport.setAttribute("y", offsetY);
}

svgWrapper.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.1 : -0.1;
  const newScale = Math.min(2.5, Math.max(0.7, currentScale + delta));
  currentScale = newScale;
  updateTransform();
});

svgWrapper.addEventListener("mousedown", (e) => {
  isPanning = true;
  startPan = { x: e.clientX - currentTranslate.x, y: e.clientY - currentTranslate.y };
});

window.addEventListener("mousemove", (e) => {
  if (!isPanning) return;
  currentTranslate.x = e.clientX - startPan.x;
  currentTranslate.y = e.clientY - startPan.y;
  updateTransform();
});

window.addEventListener("mouseup", () => {
  isPanning = false;
});

/* =======================
   INIT
======================= */

renderLists();
applyLineColors();
resetHighlight();
attachHoverEffects();
updateTransform();
</script>
